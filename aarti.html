<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>श्री कृष्ण आरती | Aarti</title>
<meta name="theme-color" content="#B8923C">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B8923C;--gold-light:#D8B35F;--gold-deep:#8A6A26;
  --slate:#4A5A63;--slate-deep:#2E3B42;--ink:#2C3438;--ink-muted:#66757C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom,0px);
  background:linear-gradient(180deg,#f6f1e2 0%,#eef4f2 55%,#e6efec 100%);
}
.topbar{
  position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 16px 12px;
  background:rgba(255,255,255,0.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(184,146,60,0.25);
}
.back-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;border:1px solid rgba(184,146,60,0.4);
  background:rgba(255,255,255,0.8);color:var(--slate-deep);display:flex;align-items:center;
  justify-content:center;cursor:pointer;padding:0;
}
.back-btn svg{width:18px;height:18px}
.topbar h1{flex:1;margin:0;font-size:16px;font-weight:600;color:var(--gold-deep);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:6px}
.tool-btn{
  min-width:36px;height:36px;padding:0 8px;border-radius:18px;border:1px solid rgba(184,146,60,0.4);
  background:rgba(255,255,255,0.8);color:var(--slate-deep);font-family:inherit;font-size:13px;
  font-weight:600;cursor:pointer;
}
.tool-btn:active{background:rgba(184,146,60,0.15)}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
.hidden{display:none!important}

/* list */
.intro{text-align:center;margin:6px 0 18px}
.intro .lamp{font-size:34px;line-height:1}
.intro p{margin:6px 0 0;font-size:13.5px;color:var(--ink-muted)}
.aarti-list{display:flex;flex-direction:column;gap:12px}
.aarti-card{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;font-family:inherit;
  background:rgba(255,255,255,0.8);border:1px solid rgba(184,146,60,0.35);border-radius:16px;
  padding:14px 16px;cursor:pointer;box-shadow:0 6px 14px rgba(74,90,99,.1);color:var(--ink);
  transition:transform .12s,background .12s;
}
.aarti-card:active{transform:scale(.98);background:rgba(250,244,228,0.95)}
.aarti-num{
  width:38px;height:38px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;
  background:radial-gradient(circle at 35% 30%,var(--gold-light),var(--gold) 70%,var(--gold-deep));
}
.aarti-info{flex:1;min-width:0}
.aarti-title{font-family:'Tiro Devanagari Hindi',Poppins,sans-serif;font-size:17px;font-weight:600;color:var(--slate-deep)}
.aarti-sub{font-size:12px;color:var(--ink-muted);margin-top:2px}
.chev{width:18px;height:18px;color:var(--gold-deep);flex-shrink:0}

/* detail */
.aarti-head{text-align:center;margin-bottom:16px}
.aarti-head .om{font-size:30px;line-height:1}
.aarti-head h2{font-family:'Tiro Devanagari Hindi',Poppins,sans-serif;font-size:22px;margin:8px 0 2px;color:var(--gold-deep)}
.aarti-head .sub{font-size:12.5px;color:var(--ink-muted)}
.divider{height:1px;margin:14px auto 0;width:60%;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.lyrics{
  background:rgba(255,255,255,0.85);border:1px solid rgba(184,146,60,0.35);border-radius:18px;
  padding:22px 20px;box-shadow:0 8px 20px rgba(74,90,99,.12);
}
.verse{
  font-family:'Tiro Devanagari Hindi',Poppins,sans-serif;font-size:var(--fs,19px);line-height:1.95;
  text-align:center;color:var(--slate-deep);white-space:pre-line;margin:0 0 18px;
}
.verse:last-child{margin-bottom:0}
.verse.refrain{color:var(--gold-deep);font-weight:600;padding:12px 8px;background:rgba(250,244,228,0.9);
  border-radius:12px;border:1px solid rgba(184,146,60,0.3)}
.note{margin-top:14px;text-align:center;font-size:11.5px;color:var(--ink-muted)}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--slate-deep);color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20
}
.toast.show{opacity:1}
</style></head><body>

<div class="topbar">
  <button class="back-btn" id="backBtn" aria-label="Back">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <h1 id="pageTitle">श्री कृष्ण आरती</h1>
  <div class="tools hidden" id="tools">
    <button class="tool-btn" id="fontDown" aria-label="Smaller text">A−</button>
    <button class="tool-btn" id="fontUp" aria-label="Larger text">A+</button>
    <button class="tool-btn" id="shareBtn" aria-label="Share">⤴</button>
  </div>
</div>

<!-- LIST PAGE -->
<div class="wrap" id="listView">
  <div class="intro">
    <div class="lamp">🪔</div>
    <p id="introText">किसी भी आरती पर क्लिक करें</p>
  </div>
  <div class="aarti-list" id="aartiList"></div>
</div>

<!-- DETAIL PAGE -->
<div class="wrap hidden" id="detailView">
  <div class="aarti-head">
    <div class="om">🪷</div>
    <h2 id="dTitle"></h2>
    <div class="sub" id="dSub"></div>
    <div class="divider"></div>
  </div>
  <div class="lyrics" id="dLyrics"></div>
  <div class="note" id="dNote"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ------------------------------------------------------------------
   HOW TO ADD A NEW AARTI
   Copy one block in AARTIS below and change it.
   - Separate verses with a blank line inside the backticks.
   - Put a verse in the "refrain" list (by its number, starting at 0)
     to highlight it (the repeating chorus line).
------------------------------------------------------------------- */
var AARTIS = [
  {
    id: "kunj-bihari",
    title: {hi:"आरती कुंज बिहारी की", en:"Aarti Kunj Bihari Ki"},
    sub:   {hi:"श्री गिरिधर कृष्ण मुरारी की", en:"Shri Giridhar Krishna Murari"},
    refrain: [0],
    verses: [
`आरती कुंज बिहारी की,
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की,
श्री गिरिधर कृष्ण मुरारी की ॥`,

`गले में बैजंती माला,
बजावै मुरली मधुर बाला ।
श्रवण में कुण्डल झलकाला,
नंद के आनंद नंदलाला ।
गगन सम अंग कांति काली,
राधिका चमक रही आली ।
लतन में ठाढ़े बनमाली,
भ्रमर सी अलक, कस्तूरी तिलक,
चंद्र सी झलक, ललित छवि श्यामा प्यारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`,

`कनकमय मोर मुकुट बिलसै,
देवता दरसन को तरसैं ।
गगन सों सुमन रासि बरसै,
बजे मुरचंग, मधुर मिरदंग,
ग्वालिन संग, अतुल रति गोप कुमारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`,

`जहां ते प्रकट भई गंगा,
कलुष कलि हारिणि श्रीगंगा ।
स्मरन ते होत मोह भंगा,
बसी शिव सीस, जटा के बीच,
हरै अघ कीच, चरन छवि श्रीबनवारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`,

`चमकती उज्ज्वल तट रेनू,
बज रही वृंदावन बेनू ।
चहुं दिसि गोपि ग्वाल धेनू,
हँसत मृदु मंद, चांदनी चंद,
कटत भव फंद, टेर सुन दीन भिखारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`
    ]
  },
  {
    id: "yugal-kishor",
    title: {hi:"आरती युगलकिशोर की", en:"Aarti Yugal Kishor Ki"},
    sub:   {hi:"श्री राधा-कृष्ण की आरती", en:"Aarti of Shri Radha-Krishna"},
    refrain: [0],
    verses: [
`आरती युगलकिशोर की कीजै,
तन मन न्यौछावर कीजै ॥`,

`गौरश्याम मुख निरखन लीजै,
हरि का रूप नयन भरि पीजै ॥
रवि शशि कोटि बदन की शोभा,
ताहि निरखि मेरो मन लोभा ॥`,

`ओढ़े नील पीत पट सारी,
कुंजबिहारी गिरिवरधारी ॥
फूलन सेज फूल की माला,
रत्न सिंहासन बैठे नंदलाला ॥`,

`कंचन थार कपूर की बाती,
हरि आए निर्मल भई छाती ॥
श्री पुरुषोत्तम गिरिवरधारी,
आरती करत सकल ब्रजनारी ॥`,

`नंद-नंदन ब्रजभान किशोरी,
परमानंद स्वामी अविचल जोरी ॥`
    ]
  },
  {
    id: "om-jai-jagdish",
    title: {hi:"ॐ जय जगदीश हरे", en:"Om Jai Jagdish Hare"},
    sub:   {hi:"श्री हरि विष्णु / श्री कृष्ण की आरती", en:"Aarti of Shri Hari Vishnu / Krishna"},
    refrain: [0],
    verses: [
`ॐ जय जगदीश हरे, स्वामी जय जगदीश हरे ।
भक्त जनों के संकट, दास जनों के संकट,
क्षण में दूर करे ॥
ॐ जय जगदीश हरे ॥`,

`जो ध्यावे फल पावे, दुख बिनसे मन का ।
स्वामी दुख बिनसे मन का ।
सुख सम्पति घर आवे, सुख सम्पति घर आवे,
कष्ट मिटे तन का ॥
ॐ जय जगदीश हरे ॥`,

`मात पिता तुम मेरे, शरण गहूं मैं किसकी ।
स्वामी शरण गहूं मैं किसकी ।
तुम बिन और न दूजा, तुम बिन और न दूजा,
आस करूं मैं जिसकी ॥
ॐ जय जगदीश हरे ॥`,

`तुम पूरण परमात्मा, तुम अन्तर्यामी ।
स्वामी तुम अन्तर्यामी ।
पारब्रह्म परमेश्वर, पारब्रह्म परमेश्वर,
तुम सब के स्वामी ॥
ॐ जय जगदीश हरे ॥`,

`तुम करुणा के सागर, तुम पालन-कर्ता ।
स्वामी तुम पालन-कर्ता ।
मैं मूरख फलकामी, मैं सेवक तुम स्वामी,
कृपा करो भर्ता ॥
ॐ जय जगदीश हरे ॥`,

`तुम हो एक अगोचर, सबके प्राणपति ।
स्वामी सबके प्राणपति ।
किस विधि मिलूँ दयामय, किस विधि मिलूँ दयामय,
तुमको मैं कुमति ॥
ॐ जय जगदीश हरे ॥`,

`दीन-बन्धु दुख-हर्ता, ठाकुर तुम मेरे ।
स्वामी रक्षक तुम मेरे ।
अपने हाथ उठाओ, अपने शरण लगाओ,
द्वार पड़ा तेरे ॥
ॐ जय जगदीश हरे ॥`,

`विषय-विकार मिटाओ, पाप हरो देवा ।
स्वामी पाप हरो देवा ।
श्रद्धा भक्ति बढ़ाओ, श्रद्धा भक्ति बढ़ाओ,
संतन की सेवा ॥
ॐ जय जगदीश हरे ॥`
    ]
  },
  {
    id: "radha-ji",
    title: {hi:"आरती श्री वृषभानुसुता की", en:"Aarti Shri Vrishabhanusuta Ki"},
    sub:   {hi:"श्री राधा रानी की आरती", en:"Aarti of Shri Radha Rani"},
    refrain: [0],
    verses: [
`आरती श्री वृषभानुसुता की,
मंजु मूर्ति मोहन ममता की ॥`,

`त्रिविध तापयुत संसृति नाशिनि,
विमल विवेक विराग विकासिनि ।
पावन प्रभु पद प्रीति प्रकाशिनि,
सुन्दरतम छवि सुन्दरता की ॥
आरती श्री वृषभानुसुता की ॥`,

`मुनि मन मोहन मोहन मोहनि,
मधुर मनोहर मूरति सोहनि ।
अविरल प्रेम अमिय रस दोहनि,
प्रिय अति सदा सखी ललिता की ॥
आरती श्री वृषभानुसुता की ॥`,

`संतत सेव्य सत मुनि जन की,
आकर अमित दिव्य गुन गन की ।
आकर्षिणी कृष्ण तन मन की,
अति अमूल्य सम्पति समता की ॥
आरती श्री वृषभानुसुता की ॥`,

`कृष्णात्मिका, कृष्ण सहचारिणि,
चिन्मय वृन्दा विपिन विहारिणि ।
जगज्जननि जग दुःख निवारिणि,
आदि अनादि शक्ति विभुता की ॥
आरती श्री वृषभानुसुता की ॥`
    ]
  },
  {
    id: "govardhan",
    title: {hi:"श्री गोवर्धन महाराज की आरती", en:"Aarti Shri Govardhan Maharaj"},
    sub:   {hi:"गिरिराज जी की आरती", en:"Aarti of Shri Giriraj ji"},
    refrain: [0],
    verses: [
`श्री गोवर्धन महाराज,
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तोपे पान चढ़े, तोपे फूल चढ़े,
तोपे चढ़े दूध की धार ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तेरी सात कोस की परिकम्मा,
और चकलेश्वर विश्राम ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तेरे गले में कण्ठा साज रह्यो,
ठोड़ी पे हीरा लाल ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तेरे कानन कुण्डल चमक रहे,
तेरी झाँकी बनी विशाल ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`गिरिराज धरण प्रभु तेरी शरण,
करो भक्त का बेड़ा पार ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`
    ]
  },
  {
    id: "gita-ji",
    title: {hi:"श्री भगवद्गीता जी की आरती", en:"Aarti Shri Bhagavad Gita Ji"},
    sub:   {hi:"जय भगवद्गीते", en:"Jai Bhagavad Gite"},
    refrain: [0],
    verses: [
`जय भगवद्गीते, जय भगवद्गीते ।
हरि-हिय-कमल-विहारिणि सुन्दर सुपुनीते ॥ जय भगवद्गीते ॥`,

`कर्म-सुमर्म-प्रकाशिनि कामासक्तिहरा ।
तत्त्वज्ञान-विकासिनि विद्या ब्रह्म परा ॥
जय भगवद्गीते ॥`,

`निश्चल-भक्ति-विधायिनि निर्मल मलहारी ।
शरण-रहस्य-प्रदायिनि सब विधि सुखकारी ॥
जय भगवद्गीते ॥`,

`राग-द्वेष-विदारिणि कारिणि मोद सदा ।
भव-भय-हारिणि तारिणि परमानन्दप्रदा ॥
जय भगवद्गीते ॥`,

`आसुर-भाव-विनाशिनि नाशिनि तम रजनी ।
दैवी सद्गुण-दायिनि हरि-रसिका सजनी ॥
जय भगवद्गीते ॥`,

`समता, त्याग सिखावनि, हरि-मुख की बानी ।
सकल शास्त्र की स्वामिनि श्रुतियों की रानी ॥
जय भगवद्गीते ॥`,

`दया-सुधा बरसावनि, मातु ! कृपा कीजै ।
हरि-पद-प्रेम दान कर अपनो कर लीजै ॥
जय भगवद्गीते ॥`
    ]
  },
  {
    id: "shyam-baba",
    title: {hi:"ॐ जय श्री श्याम हरे", en:"Om Jai Shri Shyam Hare"},

    refrain: [0],

`भाव भक्ति के कारण, छिन-छिन रूप धरयो ।

`ग्वाल-बाल संग राजा, वन में भक्ति करी ।

जय लक्ष्मी रमणा ॥`,

`श्री सत्यनारायण जी की आरती, जो कोई नर गावे ।
तन मन सुख संपत्ति, मनवांछित फल पावे ॥

  },
  {

    title: {hi:"जय जय तुलसी माता", en:"Jai Jai Tulsi Mata"},

    refrain: [0],
    verses: [

जय जय तुलसी माता ॥`,

`हरि के शीश विराजत, त्रिभुवन से हो वंदित ।

`हरि को तुम अति प्यारी, श्यामवर्ण सुकुमारी ।

जय जय तुलसी माता ॥`
    ]
  },
  {
    id: "lakshmi-mata",
    title: {hi:"ॐ जय लक्ष्मी माता", en:"Om Jai Lakshmi Mata"},
    sub:   {hi:"श्री महालक्ष्मी जी की आरती", en:"Aarti of Shri Mahalakshmi ji"},
    refrain: [0],
    verses: [
`ॐ जय लक्ष्मी माता,
मैया जय लक्ष्मी माता ।
तुमको निसदिन सेवत,
हर विष्णु विधाता ॥
ॐ जय लक्ष्मी माता ॥`,

`उमा, रमा, ब्रह्माणी, तुम ही जग माता ।
मैया तुम ही जग माता ।
सूर्य चन्द्रमा ध्यावत, नारद ऋषि गाता ॥
ॐ जय लक्ष्मी माता ॥`,

`दुर्गा रूप निरंजनी, सुख सम्पत्ति दाता ।
मैया सुख सम्पत्ति दाता ।
जो कोई तुमको ध्यावत, ऋद्धि-सिद्धि धन पाता ॥

`तुम पाताल निवासिनी, तुम ही शुभदाता ।

`जिस घर में तुम रहतीं, तहँ सब सद्गुण आता ।

`तुम बिन यज्ञ न होते, वस्त्र न कोई पाता ।

`शुभ-गुण मन्दिर सुन्दर, क्षीरोदधि जाता ।

`महालक्ष्मी जी की आरती, जो कोई नर गाता ।

ॐ जय लक्ष्मी माता ॥`
    ]
  }
];

var UI = {
  hi:{title:"श्री कृष्ण आरती", intro:"किसी भी आरती पर क्लिक करें", note:"जय श्री कृष्ण 🙏", copied:"कॉपी हो गया", shareTxt:"श्री कृष्ण वाणी ऐप से"},
  en:{title:"Shri Krishna Aarti", intro:"Tap any aarti to read it in full", note:"Jai Shri Krishna 🙏", copied:"Copied", shareTxt:"via Shri Krishna Vani app"}
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var lang = lsGet("krishna_lang") === "en" ? "en" : "hi";
var fontSize = parseInt(lsGet("aarti_font"),10) || 19;
var current = null;

var $ = function(id){ return document.getElementById(id); };
var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function renderList(){
  $("aartiList").innerHTML = AARTIS.map(function(a,i){
    return '<button class="aarti-card" data-id="'+esc(a.id)+'">' +
      '<div class="aarti-num">'+(i+1)+'</div>' +
      '<div class="aarti-info"><div class="aarti-title">'+esc(a.title[lang])+'</div>' +
      '<div class="aarti-sub">'+esc(a.sub[lang])+'</div></div>'+CHEV+'</button>';
  }).join("");
  $("introText").textContent = UI[lang].intro;
}

function renderDetail(a){
  $("dTitle").textContent = a.title[lang];
  $("dSub").textContent = a.sub[lang];
  $("dLyrics").innerHTML = a.verses.map(function(v,i){
    var cls = (a.refrain && a.refrain.indexOf(i) > -1) ? "verse refrain" : "verse";
    return '<p class="'+cls+'">'+esc(v)+'</p>';
  }).join("");
  $("dNote").textContent = UI[lang].note;
  document.documentElement.style.setProperty("--fs", fontSize+"px");
}

function route(){
  var id = decodeURIComponent((location.hash || "").replace(/^#/,""));
  var a = AARTIS.filter(function(x){ return x.id === id; })[0];
  window.scrollTo(0,0);
  if(a){
    current = a;
    renderDetail(a);
    $("listView").classList.add("hidden");
    $("detailView").classList.remove("hidden");
    $("tools").classList.remove("hidden");
    $("pageTitle").textContent = a.title[lang];
    document.title = a.title[lang];
  } else {
    current = null;
    $("detailView").classList.add("hidden");
    $("tools").classList.add("hidden");
    $("listView").classList.remove("hidden");
    $("pageTitle").textContent = UI[lang].title;
    document.title = UI[lang].title;
  }
}

$("aartiList").addEventListener("click", function(e){
  var card = e.target.closest(".aarti-card");
  if(card){ location.hash = encodeURIComponent(card.getAttribute("data-id")); }
});

$("backBtn").addEventListener("click", function(){
  if(current){
    location.hash = "";
  } else {
    window.location.href = "index.html";
  }
});

function setFont(delta){
  fontSize = Math.max(15, Math.min(30, fontSize + delta));
  lsSet("aarti_font", fontSize);
  document.documentElement.style.setProperty("--fs", fontSize+"px");
}
$("fontDown").addEventListener("click", function(){ setFont(-2); });
$("fontUp").addEventListener("click", function(){ setFont(2); });

function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1600);
}
$("shareBtn").addEventListener("click", function(){
  if(!current) return;
  var text = current.title[lang] + "\n\n" + current.verses.join("\n\n") + "\n\n— " + UI[lang].shareTxt;
  if(navigator.share){
    navigator.share({title: current.title[lang], text: text}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast(UI[lang].copied); });
  }
});

window.addEventListener("hashchange", route);
renderList();
route();
</script>
</body></html>
