<title>श्री कृष्ण भक्ति | आरती, भजन, मंत्र</title>

<style>
:root,[data-theme="dark"]{
  --bg:#0D1431;
  --bg-glow:rgba(230,190,99,.16);
  --panel:rgba(255,255,255,.05);
  --line:rgba(230,190,99,.26);
  --text:#F5EBD3;
  --muted:#A9B3D4;
  --gold:#E6BE63;
  --gold-soft:rgba(230,190,99,.13);
  --teal:#2BC0B0;
  --on-gold:#0D1431;
  --chip:rgba(255,255,255,.08);
}
[data-theme="light"]{
  --bg:#EEF4F2;
  --bg-glow:rgba(184,146,60,.18);
  --panel:rgba(255,255,255,.82);
  --line:rgba(138,106,38,.30);
  --text:#1B2650;
  --muted:#5B6882;
  --gold:#8A6A26;
  --gold-soft:rgba(184,146,60,.14);
  --teal:#13857B;
  --on-gold:#FFFFFF;
  --chip:rgba(27,38,80,.07);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  min-height:100dvh;color:var(--text);background:var(--bg);
  font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;
  background-image:
    radial-gradient(120% 55% at 85% -5%,var(--bg-glow),transparent 60%),
    radial-gradient(90% 40% at 0% 100%,rgba(43,192,176,.10),transparent 60%);
  background-attachment:fixed;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.hidden{display:none!important}

/* top bar */
.topbar{
  position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;
  background:linear-gradient(180deg,var(--bg) 55%,transparent);
}
.icon-btn{
  width:40px;height:40px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);background:var(--chip);cursor:pointer;padding:0;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.icon-btn svg{width:19px;height:19px}
.icon-btn:active{background:var(--gold-soft)}
.topbar .spacer{flex:1;min-width:0}
.crumb{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* list */
.wrap{max-width:560px;margin:0 auto;padding:0 16px 48px}
.hero{position:relative;padding:8px 4px 26px;min-height:190px}
.hero .feather{
  position:absolute;right:-14px;top:-30px;height:250px;width:auto;
  transform:rotate(14deg);transform-origin:50% 100%;
  filter:drop-shadow(0 0 22px rgba(230,190,99,.35));pointer-events:none;
}
.hero h1{
  position:relative;margin:34px 0 8px;max-width:64%;
  font-family:'Yatra One','Tiro Devanagari Hindi',serif;font-weight:400;
  font-size:clamp(30px,9vw,40px);line-height:1.25;color:var(--gold);
}
.hero p{position:relative;margin:0;max-width:62%;font-size:13.5px;line-height:1.6;color:var(--muted)}
.group{margin-top:22px}
.group h2{
  margin:0 0 10px 4px;font-family:'Yatra One','Tiro Devanagari Hindi',serif;font-weight:400;
  font-size:17px;color:var(--text);display:flex;align-items:center;gap:10px;
}
.group h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.rows{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:20px;background:var(--panel);overflow:hidden;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.rows li+li{border-top:1px solid var(--line)}
.row{
  display:flex;align-items:center;gap:14px;width:100%;padding:13px 14px;text-align:left;
  background:none;border:0;cursor:pointer;transition:background .15s;
}
.row:active{background:var(--gold-soft)}
.row .ic{
  width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-size:22px;line-height:1;
  background:radial-gradient(circle at 35% 30%,var(--gold-soft),transparent 75%),var(--chip);
  box-shadow:inset 0 0 0 1.5px var(--gold);
}
.row .tx{flex:1;min-width:0}
.row .t,.row .s{display:block}
.row .t{font-family:'Tiro Devanagari Hindi',serif;font-size:18.5px;line-height:1.35;color:var(--text)}
.row .s{margin-top:2px;font-size:12px;line-height:1.45;color:var(--muted)}
.row .chev{width:18px;height:18px;flex-shrink:0;color:var(--gold)}

/* detail */
.detail-hero{text-align:center;padding:2px 8px 6px}
.diya{width:84px;height:84px;margin:0 auto}
.flame{transform-origin:50% 100%;animation:flicker 2.4s ease-in-out infinite}
.glow{animation:pulse 2.4s ease-in-out infinite}
@keyframes flicker{
  0%,100%{transform:scale(1,1) skewX(0)}
  22%{transform:scale(.96,1.07) skewX(-2deg)}
  48%{transform:scale(1.03,.96) skewX(1.5deg)}
  74%{transform:scale(.98,1.05) skewX(-1deg)}
}
@keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
.detail-hero h2{
  margin:8px 0 4px;font-family:'Yatra One','Tiro Devanagari Hindi',serif;font-weight:400;
  font-size:clamp(26px,7.4vw,32px);line-height:1.3;color:var(--gold);text-wrap:balance;
}
.detail-hero .sub{font-size:13px;line-height:1.5;color:var(--muted)}
.tools{display:flex;justify-content:center;gap:8px;margin:16px 0 18px}
.pill{
  min-width:46px;height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);
  background:var(--chip);cursor:pointer;font-size:13.5px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;
}
.pill:active{background:var(--gold-soft)}
.pill svg{width:16px;height:16px}

.lyrics{
  border:1px solid var(--line);border-radius:24px;background:var(--panel);
  padding:26px 18px 22px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.verse{
  margin:0;text-align:center;white-space:pre-line;
  font-family:'Tiro Devanagari Hindi',serif;font-size:var(--fs,20px);line-height:2;color:var(--text);
}
.verse.refrain{color:var(--gold);font-size:calc(var(--fs,20px) + 2px);line-height:1.9}
.verse.prose{text-align:left;white-space:normal;font-size:var(--fs,20px);line-height:1.95;margin:0 0 16px}
.verse.prose.refrain{color:var(--gold);font-size:var(--fs,20px);margin:20px 0 0;padding-top:16px;border-top:1px solid var(--line)}
.ph{margin:24px 0 8px;text-align:left;font-family:'Yatra One','Tiro Devanagari Hindi',serif;font-weight:400;font-size:calc(var(--fs,20px) + 1px);color:var(--gold)}
.ph:first-child{margin-top:0}
.orn{display:flex;align-items:center;gap:10px;margin:18px auto;max-width:240px;color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.orn::after{background:linear-gradient(270deg,transparent,var(--line))}
.orn svg{width:14px;height:14px;flex-shrink:0}
.closing{margin:22px 0 4px;text-align:center;font-family:'Yatra One','Tiro Devanagari Hindi',serif;font-size:19px;color:var(--gold)}
.pager{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
.pg{
  display:flex;flex-direction:column;gap:3px;padding:12px 14px;border:1px solid var(--line);border-radius:16px;
  background:var(--panel);cursor:pointer;text-align:left;min-width:0;
}
.pg:active{background:var(--gold-soft)}
.pg.next{text-align:right;align-items:flex-end}
.pg small{font-size:11.5px;color:var(--muted)}
.pg span{font-family:'Tiro Devanagari Hindi',serif;font-size:15.5px;line-height:1.35;color:var(--text);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.enter{animation:enter .28s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast{
  position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--gold);color:var(--on-gold);padding:9px 18px;border-radius:20px;font-size:13px;font-weight:500;
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:20
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){
  .flame,.glow,.enter{animation:none}
  .row,.toast{transition:none}
}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px;margin:0 -2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--line);background:var(--chip);cursor:pointer;
  font-family:'Tiro Devanagari Hindi',serif;font-size:16.5px;color:var(--text);white-space:nowrap}
.tab[aria-selected="true"]{background:var(--gold);color:var(--on-gold);border-color:var(--gold)}
.listen{display:flex;justify-content:center;margin-top:18px}
.listen a{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px;border-radius:20px;border:1px solid var(--line);
  background:var(--chip);color:var(--text);text-decoration:none;font-size:13.5px;font-weight:500}
.listen a:active{background:var(--gold-soft)}
.yt{position:relative;width:100%;aspect-ratio:16/9;margin-top:18px;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.japa{text-align:center;margin:0 0 18px}
.jbtn{width:132px;height:132px;border-radius:50%;border:1.5px solid var(--gold);cursor:pointer;user-select:none;
  background:radial-gradient(circle at 35% 30%,var(--gold-soft),transparent 75%),var(--chip);
  display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.jbtn:active{transform:scale(.97)}
.jbtn b{font-size:36px;font-weight:600;color:var(--gold);line-height:1}
.jbtn small{font-size:11.5px;color:var(--muted)}
.jmeta{display:flex;justify-content:center;align-items:center;gap:12px;margin-top:10px;font-size:13px;color:var(--muted)}
</style></head><body>

items: [
{ id:"mere-to-girdhar", cat:"bhajan",
  title:{hi:"मेरे तो गिरधर गोपाल", en:"Mere To Girdhar Gopal"},
  sub:{hi:"संत मीराबाई", en:"Saint Meerabai"}, refrain:[0],
  verses:[
`मेरे तो गिरधर गोपाल, दूसरो न कोई ।
जाके सिर मोर मुकुट, मेरो पति सोई ॥`,
`तात मात भ्रात बंधु, आपनो न कोई ।
छाँड़ि दई कुल की कानि, कहा करिहै कोई ॥`,
`संतन ढिग बैठि बैठि, लोक लाज खोई ।
अँसुवन जल सींचि सींचि, प्रेम बेलि बोई ॥`,
`अब तो बेल फैल गई, आणँद फल होई ।
दासी मीरा लाल गिरधर, तारो अब मोही ॥`
]},
{ id:"baso-more-nainan", cat:"bhajan",
  title:{hi:"बसो मोरे नैनन में नंदलाल", en:"Baso More Nainan Mein Nandlal"},
  sub:{hi:"संत मीराबाई", en:"Saint Meerabai"}, refrain:[0],
  verses:[
`बसो मोरे नैनन में नंदलाल ।
मोहनी मूरति साँवरी सूरति, नैना बने बिशाल ॥`,
`अधर सुधारस मुरली राजत, उर बैजंती माल ।
छुद्र घंटिका कटि तट सोभित, नूपुर सबद रसाल ॥`,
`मीरा प्रभु संतन सुखदाई, भगत बछल गोपाल ॥`
]},
{ id:"maiya-makhan", cat:"bhajan",
  title:{hi:"मैया मैं नहिं माखन खायो", en:"Maiya Main Nahin Makhan Khayo"},
  sub:{hi:"महाकवि सूरदास", en:"Poet Surdas"}, refrain:[0],
  verses:[
`मैया मैं नहिं माखन खायो ।
भोर भयो गैयन के पाछे, मधुबन मोहिं पठायो ॥
चार पहर बंसीबट भटक्यो, साँझ परे घर आयो ॥`,
`मैं बालक बहियन को छोटो, छींको किहि बिधि पायो ।
ग्वाल बाल सब बैर परे हैं, बरबस मुख लपटायो ॥`,
`तू जननी मन की अति भोरी, इनके कहें पतियायो ।
जिय तेरे कछु भेद उपजि है, जानि परायो जायो ॥`,
`यह लै अपनी लकुटि कमरिया, बहुतहिं नाच नचायो ।
सूरदास तब बिहँसि जसोदा, लै उर कंठ लगायो ॥`
]},
{ id:"krishna-govind-hare", cat:"bhajan",
  title:{hi:"श्री कृष्ण गोविन्द हरे मुरारे", en:"Shri Krishna Govind Hare Murare"},
  sub:{hi:"पारंपरिक भजन", en:"Traditional bhajan"}, refrain:[0],
  verses:[
`श्री कृष्ण गोविन्द हरे मुरारे ।
हे नाथ नारायण वासुदेवा ॥`,
`पितु मात स्वामी सखा हमारे ।
हे नाथ नारायण वासुदेवा ॥`
]},
{ id:"hare-krishna-mantra", cat:"mantra",
  title:{hi:"हरे कृष्ण महामंत्र", en:"Hare Krishna Maha Mantra"},
  sub:{hi:"108 बार जप के लिए", en:"For 108-count japa"}, refrain:[0],
  verses:[
`हरे कृष्ण हरे कृष्ण, कृष्ण कृष्ण हरे हरे ।
हरे राम हरे राम, राम राम हरे हरे ॥`
]},
{ id:"om-namo-bhagavate", cat:"mantra",
  title:{hi:"ॐ नमो भगवते वासुदेवाय", en:"Om Namo Bhagavate Vasudevaya"},
  sub:{hi:"द्वादशाक्षर मंत्र", en:"The twelve-syllable mantra"}, refrain:[0],
  verses:[`ॐ नमो भगवते वासुदेवाय ॥`]
},
{ id:"krishna-gayatri", cat:"mantra",
  title:{hi:"कृष्ण गायत्री मंत्र", en:"Krishna Gayatri Mantra"},
  sub:{hi:"श्री कृष्ण का ध्यान मंत्र", en:"Meditation mantra of Shri Krishna"}, refrain:[0],
  verses:[
`ॐ देवकीनन्दनाय विद्महे,
वासुदेवाय धीमहि ।
तन्नो कृष्णः प्रचोदयात् ॥`
]},
{ id:"krishnaya-vasudevaya", cat:"mantra",
  title:{hi:"कृष्णाय वासुदेवाय", en:"Krishnaya Vasudevaya"},
  sub:{hi:"श्री कृष्ण प्रणाम मंत्र", en:"Pranam mantra to Shri Krishna"}, refrain:[0],
  verses:[
`कृष्णाय वासुदेवाय हरये परमात्मने ।
प्रणतक्लेशनाशाय गोविन्दाय नमो नमः ॥`
]},
{ id:"karmanye", cat:"mantra",
  title:{hi:"कर्मण्येवाधिकारस्ते", en:"Karmanye Vadhikaraste"},
  sub:{hi:"श्रीमद्भगवद्गीता 2.47", en:"Bhagavad Gita 2.47"}, refrain:[0],
  verses:[
`कर्मण्येवाधिकारस्ते मा फलेषु कदाचन ।
मा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि ॥`
]},
{ id:"yada-yada", cat:"mantra",
  title:{hi:"यदा यदा हि धर्मस्य", en:"Yada Yada Hi Dharmasya"},
  sub:{hi:"श्रीमद्भगवद्गीता 4.7–4.8", en:"Bhagavad Gita 4.7–4.8"}, refrain:[0],
  verses:[
`यदा यदा हि धर्मस्य ग्लानिर्भवति भारत ।
अभ्युत्थानमधर्मस्य तदात्मानं सृजाम्यहम् ॥`,
`परित्राणाय साधूनां विनाशाय च दुष्कृताम् ।
धर्मसंस्थापनार्थाय सम्भवामि युगे युगे ॥`
]},
{ id:"sarva-dharman", cat:"mantra",
  title:{hi:"सर्वधर्मान्परित्यज्य", en:"Sarva Dharman Parityajya"},
  sub:{hi:"श्रीमद्भगवद्गीता 18.66", en:"Bhagavad Gita 18.66"}, refrain:[0],
  verses:[
`सर्वधर्मान्परित्यज्य मामेकं शरणं व्रज ।
अहं त्वां सर्वपापेभ्यो मोक्षयिष्यामि मा शुचः ॥`
]},,
{ id:"maiya-mohi-dau", cat:"bhajan",
  title:{hi:"मैया मोहि दाऊ बहुत खिझायो", en:"Maiya Mohi Dau Bahut Khijayo"},
  sub:{hi:"महाकवि सूरदास", en:"Poet Surdas"}, refrain:[0],
  verses:[
`मैया मोहि दाऊ बहुत खिझायो ।
मोसों कहत मोल को लीन्हो, तोहि जसुमति कब जायो ॥`,
`कहा कहौं इहि रिस के मारे, खेलन हौं नहिं जात ।
पुनि पुनि कहत कौन है माता, को है तेरो तात ॥`,
`गोरे नंद जसोदा गोरी, तू कत स्याम सरीर ।
चुटकी दै दै हँसत ग्वाल सब, सिखै देत बलबीर ॥`,
`तू मोही कौं मारन सीखी, दाउहि कबहुँ न खीझै ।
मोहन-मुख रिस की ये बातैं, जसुमति सुनि सुनि रीझै ॥`,
`सुनहु कान्ह बलभद्र चबाई, जनमत ही कौ धूत ।
सूर स्याम मोहि गोधन की सौं, हौं माता तू पूत ॥`
]},
{ id:"madhurashtakam", cat:"bhajan",
  title:{hi:"मधुराष्टकम्", en:"Madhurashtakam"},
  sub:{hi:"श्री वल्लभाचार्य कृत — अधरं मधुरं", en:"By Shri Vallabhacharya — Adharam Madhuram"}, refrain:[0],
  verses:[
`अधरं मधुरं वदनं मधुरं, नयनं मधुरं हसितं मधुरम् ।
हृदयं मधुरं गमनं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`वचनं मधुरं चरितं मधुरं, वसनं मधुरं वलितं मधुरम् ।
चलितं मधुरं भ्रमितं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`वेणुर्मधुरो रेणुर्मधुरः, पाणिर्मधुरः पादौ मधुरौ ।
नृत्यं मधुरं सख्यं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`गीतं मधुरं पीतं मधुरं, भुक्तं मधुरं सुप्तं मधुरम् ।
रूपं मधुरं तिलकं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`करणं मधुरं तरणं मधुरं, हरणं मधुरं रमणं मधुरम् ।
वमितं मधुरं शमितं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`गुञ्जा मधुरा माला मधुरा, यमुना मधुरा वीची मधुरा ।
सलिलं मधुरं कमलं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`गोपी मधुरा लीला मधुरा, युक्तं मधुरं मुक्तं मधुरम् ।
दृष्टं मधुरं शिष्टं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`,
`गोपा मधुरा गावो मधुरा, यष्टिर्मधुरा सृष्टिर्मधुरा ।
दलितं मधुरं फलितं मधुरं, मधुराधिपतेरखिलं मधुरम् ॥`
]},
{ id:"vasudevasutam", cat:"mantra",
  title:{hi:"वसुदेवसुतं देवं", en:"Vasudevasutam Devam"},
  sub:{hi:"श्री कृष्ण वंदना", en:"Salutation to Shri Krishna"}, refrain:[0],
  verses:[
`वसुदेवसुतं देवं कंसचाणूरमर्दनम् ।
देवकीपरमानन्दं कृष्णं वन्दे जगद्गुरुम् ॥`
]},
{ id:"kasturi-tilakam", cat:"mantra",
  title:{hi:"कस्तूरी तिलकं ललाटपटले", en:"Kasturi Tilakam Lalatapatale"},
  sub:{hi:"श्री गोपाल का ध्यान", en:"Meditation on Shri Gopal"}, refrain:[0],
  verses:[
`कस्तूरी तिलकं ललाटपटले वक्षःस्थले कौस्तुभं,
नासाग्रे वरमौक्तिकं करतले वेणुः करे कङ्कणम् ।
सर्वाङ्गे हरिचन्दनं सुललितं कण्ठे च मुक्तावलिः,
गोपस्त्रीपरिवेष्टितो विजयते गोपालचूडामणिः ॥`
]},
{ id:"om-jai-jagdish", cat:"aarti",
  title:{hi:"ॐ जय जगदीश हरे", en:"Om Jai Jagdish Hare"},
  sub:{hi:"श्री हरि (श्री कृष्ण) की आरती", en:"Aarti of Shri Hari (Shri Krishna)"}, refrain:[0],
  verses:[
`ॐ जय जगदीश हरे, स्वामी जय जगदीश हरे ।
भक्त जनों के संकट, दास जनों के संकट,
क्षण में दूर करे ॥
ॐ जय जगदीश हरे ॥`,

`जो ध्यावे फल पावे, दुख बिनसे मन का ।
स्वामी दुख बिनसे मन का ।
सुख सम्पति घर आवे, सुख सम्पति घर आवे,
कष्ट मिटे तन का ॥
ॐ जय जगदीश हरे ॥`,

`मात पिता तुम मेरे, शरण गहूं मैं किसकी ।
स्वामी शरण गहूं मैं किसकी ।
तुम बिन और न दूजा, तुम बिन और न दूजा,
आस करूं मैं जिसकी ॥
ॐ जय जगदीश हरे ॥`,

`तुम पूरण परमात्मा, तुम अन्तर्यामी ।
स्वामी तुम अन्तर्यामी ।
पारब्रह्म परमेश्वर, पारब्रह्म परमेश्वर,
तुम सब के स्वामी ॥
ॐ जय जगदीश हरे ॥`,

`तुम करुणा के सागर, तुम पालन-कर्ता ।
स्वामी तुम पालन-कर्ता ।
मैं मूरख फलकामी, मैं सेवक तुम स्वामी,
कृपा करो भर्ता ॥
ॐ जय जगदीश हरे ॥`,

`तुम हो एक अगोचर, सबके प्राणपति ।
स्वामी सबके प्राणपति ।
किस विधि मिलूँ दयामय, किस विधि मिलूँ दयामय,
तुमको मैं कुमति ॥
ॐ जय जगदीश हरे ॥`,

`दीन-बन्धु दुख-हर्ता, ठाकुर तुम मेरे ।
स्वामी रक्षक तुम मेरे ।
अपने हाथ उठाओ, अपने शरण लगाओ,
द्वार पड़ा तेरे ॥
ॐ जय जगदीश हरे ॥`,

`विषय-विकार मिटाओ, पाप हरो देवा ।
स्वामी पाप हरो देवा ।
श्रद्धा भक्ति बढ़ाओ, श्रद्धा भक्ति बढ़ाओ,
संतन की सेवा ॥
ॐ जय जगदीश हरे ॥`
]},
{ id:"banke-bihari", cat:"aarti",
  title:{hi:"श्री बाँके बिहारी तेरी आरती गाऊँ", en:"Shri Banke Bihari Teri Aarti Gaun"},
  sub:{hi:"वृंदावन के श्री बाँके बिहारी जी की आरती", en:"Aarti of Shri Banke Bihari, Vrindavan"}, refrain:[0],
  verses:[
`श्री बाँके बिहारी तेरी आरती गाऊँ,
हे गिरिधर तेरी आरती गाऊँ ।
आरती गाऊँ प्यारे, तुमको रिझाऊँ,
श्यामसुन्दर तेरी आरती गाऊँ ॥`,
`मोर मुकुट प्यारे शीश पे सोहे,
प्यारी बंसी मेरो मन मोहे ।
देख छवि बलिहारी मैं जाऊँ ॥
श्री बाँके बिहारी तेरी आरती गाऊँ ॥`,
`चरणों से निकली गंगा प्यारी,
जिसने सारी दुनिया तारी ।
मैं उन चरणों के दर्शन पाऊँ ॥
श्री बाँके बिहारी तेरी आरती गाऊँ ॥`,
`दास अनाथ के नाथ आप हो,
दुःख-सुख जीवन प्यारे साथ आप हो ।
हरि चरणों में शीश झुकाऊँ ॥
श्री बाँके बिहारी तेरी आरती गाऊँ ॥`,
`श्री हरिदास के प्यारे तुम हो,
मेरे मोहन जीवन धन हो ।
देख युगल छवि बलि-बलि जाऊँ ॥
श्री बाँके बिहारी तेरी आरती गाऊँ ॥`
]},
{ id:"bal-krishna", cat:"aarti",
  title:{hi:"आरती बाल कृष्ण की कीजै", en:"Aarti Bal Krishna Ki Keejai"},
  sub:{hi:"श्री बाल कृष्ण (लड्डू गोपाल) की आरती", en:"Aarti of Bal Krishna (Laddu Gopal)"}, refrain:[0],
  verses:[
`आरती बाल कृष्ण की कीजै,
अपना जन्म सफल कर लीजै ॥`,
`श्री यशोदा का परम दुलारा,
बाबा के अँखियन का तारा ।
गोपियन के प्राणन से प्यारा,
इन पर प्राण न्योछावर कीजै ॥
आरती बाल कृष्ण की कीजै ॥`,
`बलदाऊ के छोटे भैया,
कनुआ कहि कहि बोले मैया ।
परम मुदित मन लेत बलैया,
यह छवि नैनन में भर लीजै ॥
आरती बाल कृष्ण की कीजै ॥`,
`श्री राधावर कुँवर कन्हैया,
ब्रज जन को नवनीत खवैया ।
देखत ही मन लेत चुरैया,
अपनो सर्वस इनको दीजै ॥
आरती बाल कृष्ण की कीजै ॥`,
`तोतली बोलन मधुर सुहावै,
सखन संग खेलत सुख पावै ।
सोई सुकृती जो इनको ध्यावै,
अब इनको अपना कर लीजै ॥
आरती बाल कृष्ण की कीजै ॥`
]},
{ id:"bhog-aarti", cat:"aarti",
  title:{hi:"आओ भोग लगाओ प्यारे मोहन", en:"Aao Bhog Lagao Pyare Mohan"},
  sub:{hi:"श्री कृष्ण की भोग आरती", en:"Bhog aarti of Shri Krishna"}, refrain:[0],
  verses:[
`आओ भोग लगाओ प्यारे मोहन ॥`,
`भिलनी के बेर सुदामा के तंदुल,
रुचि रुचि भोग लगाओ प्यारे मोहन ॥`,
`दुर्योधन को मेवा त्यागो,
साग विदुर घर खायो प्यारे मोहन ॥`,
`जो कोई तुम्हारा भोग लगावे,
सुख सम्पत्ति घर आवे प्यारे मोहन ॥`,
`ऐसा भोग लगाओ प्यारे मोहन,
सब अमृत हो जाए प्यारे मोहन ॥`,
`जो कोई ऐसा भोग को खावे,
सो तेरा हो जाए प्यारे मोहन ॥
आओ भोग लगाओ प्यारे मोहन ॥`
]},
{ id:"jagannath-mangal", cat:"aarti",
  title:{hi:"आरती श्री जगन्नाथ मंगलकारी", en:"Aarti Shri Jagannath Mangalkari"},
  sub:{hi:"श्री जगन्नाथ जी (श्री कृष्ण) की मंगल आरती", en:"Mangal aarti of Shri Jagannath (Krishna)"}, refrain:[0],
  verses:[
`आरती श्री जगन्नाथ मंगलकारी,
आरती श्री बैकुंठ मंगलकारी ।
मंगलकारी नाथ आपदा हरी ॥`,
`कंचन को धूप दीप ज्योत जगमगी,
अगर कपूर बाती भाव से धरी ॥
आरती श्री जगन्नाथ मंगलकारी ॥`,
`घरन घरन घंटा बाजे, बाजे बाँसुरी,
झाँझ और मृदंग बाजे, ताल खंजरी ॥
आरती श्री जगन्नाथ मंगलकारी ॥`,
`निरखत मुखारविंद, परसत चरनारविंद आपदा हरी,
जगन्नाथ स्वामी के भोग लागो बैकुंठपुरी ॥
आरती श्री जगन्नाथ मंगलकारी,
आरती श्री बैकुंठ मंगलकारी ॥`
]},,
{ id:"krishna-janm", cat:"katha", prose:true, refrain:[6],
  title:{hi:"श्री कृष्ण जन्म", en:"Birth of Shri Krishna"},
  sub:{hi:"जन्माष्टमी की कथा", en:"The story of Janmashtami"},
  verses:[
`बहुत समय पहले की बात है। मथुरा में उग्रसेन नाम के धर्मात्मा राजा थे, पर उनके पुत्र कंस ने उन्हें कैद करके स्वयं राजसिंहासन छीन लिया। कंस बहुत शक्तिशाली था, पर उतना ही क्रूर और घमंडी भी। प्रजा उसके अत्याचार से त्रस्त थी और धरती माता गाय का रूप लेकर भगवान से रक्षा की प्रार्थना करने पहुँचीं।`,
`कंस अपनी बहन देवकी से बहुत स्नेह करता था। उसके विवाह के बाद वह स्वयं रथ हाँकते हुए उसे वसुदेव जी के साथ विदा करने निकला। तभी आकाशवाणी हुई: “कंस! जिस बहन को तू इतने प्रेम से विदा कर रहा है, उसी का आठवाँ पुत्र तेरा काल बनेगा।” यह सुनते ही कंस का प्रेम भय और क्रोध में बदल गया। उसने तलवार खींच ली, पर वसुदेव जी ने वचन दिया कि हम अपनी हर संतान आपको सौंप देंगे। तब कंस ने दोनों को कारागार में डाल दिया।`,
`कारागार में एक-एक करके छह संतानें हुईं और कंस ने उन्हें मार डाला। सातवें गर्भ को योगमाया ने रोहिणी जी के गर्भ में पहुँचा दिया, जिनसे बलराम जी प्रकट हुए। फिर आठवें गर्भ का समय आया। भाद्रपद मास की कृष्ण अष्टमी की घनघोर अँधेरी रात थी, बाहर मूसलाधार वर्षा हो रही थी और रोहिणी नक्षत्र में आधी रात को कारागार दिव्य प्रकाश से भर गया। शंख, चक्र, गदा और पद्म धारण किए चतुर्भुज रूप में भगवान प्रकट हुए। माता-पिता ने हाथ जोड़कर प्रणाम किया। प्रभु ने कहा कि मुझे गोकुल में नंद बाबा के घर पहुँचा दो और वहाँ जन्मी कन्या को ले आओ। फिर वे साधारण शिशु बन गए।`,
`तभी वसुदेव जी की बेड़ियाँ अपने आप खुल गईं, पहरेदार गहरी नींद में सो गए और भारी द्वार खुल गए। वसुदेव जी ने नन्हे कान्हा को सूप की टोकरी में रखकर सिर पर उठाया और चल पड़े। यमुना जी उफान पर थीं, पर जब कान्हा के चरण-कमल का स्पर्श हुआ तो वे शांत होकर मार्ग देने लगीं। शेषनाग ने अपने फन फैलाकर वर्षा से बालक की रक्षा की।`,
`गोकुल में सब सो रहे थे। वसुदेव जी ने कान्हा को यशोदा मैया के पास रख दिया और उनकी नवजात कन्या को लेकर लौट आए। द्वार फिर बंद हो गए। कन्या के रोने की आवाज़ से कंस जाग गया। वह दौड़ा आया और उसे पत्थर पर पटकना चाहा, पर वह कन्या योगमाया थी। वह उसके हाथ से छूटकर आकाश में पहुँची और बोली, “मूर्ख कंस! तुझे मारने वाला तो जन्म ले चुका है और कहीं सुरक्षित बड़ा हो रहा है।”`,
`सुबह होते ही गोकुल में नंद बाबा के घर बधाइयाँ बजने लगीं। सबने गाया: “नंद के घर आनंद भयो, जय कन्हैया लाल की!” इसी पावन रात की स्मृति में हम हर वर्ष जन्माष्टमी मनाते हैं, उपवास रखते हैं, झाँकियाँ सजाते हैं और आधी रात को कान्हा का जन्मोत्सव करते हैं।`,
`सीख: जब अँधेरा सबसे गहरा होता है, तभी प्रभु की रोशनी आती है। भरोसा रखने वाले की रक्षा भगवान स्वयं करते हैं।`
]},
{ id:"makhan-chor", cat:"katha", prose:true, refrain:[5],
  title:{hi:"माखनचोर कान्हा", en:"Kanha the Butter Thief"},
  sub:{hi:"गोकुल की सबसे प्यारी शरारत", en:"Gokul's sweetest mischief"},
  verses:[
`गोकुल में हर घर में गायें थीं और हर घर में दूध-दही-माखन की भरमार थी। ग्वालिनें सुबह-सुबह मथानी से दही मथतीं और ताज़ा माखन मटकों में भरकर ऊँचे छींकों पर टाँग देतीं ताकि कोई पहुँच न सके। पर गोकुल में एक नटखट बालक था जिसे ऐसे ही ऊँचे छींकों से माखन उतारने में सबसे ज़्यादा आनंद आता था। वह था नंद बाबा और यशोदा मैया का लाला, कान्हा।`,
`कान्हा अकेला नहीं जाता था। उसकी पूरी मित्र-मंडली होती: श्रीदामा, सुबल, मधुमंगल और अनेक ग्वाल-बाल। कभी सब एक-दूसरे के कंधे पर चढ़कर ऊँची मीनार बना लेते, कभी लंबी लाठी से मटके की पेंदी में छेद कर देते और नीचे मुँह खोलकर खड़े हो जाते। जो माखन गिरता, सब मिल-बाँटकर खाते और बंदरों को भी खिलाते। कान्हा कहते थे, “माखन खाना है तो अकेले नहीं, सबके साथ खाना है।”`,
`जब ग्वालिनें थक गईं तो वे यशोदा मैया के पास शिकायत लेकर पहुँचीं। मैया ने गुस्से में छड़ी उठाई और पूछा, “कान्हा, तूने माखन खाया?” कान्हा ने बड़ी भोली आँखें बनाकर कहा, “नहीं मैया! मैं तो सुबह से गायों के पीछे वन में था। ये ग्वाल-बाल मुझे झूठा फँसाते हैं। छींका इतना ऊँचा है, मेरे छोटे-छोटे हाथ वहाँ कैसे पहुँचेंगे?” पर कान्हा के होंठों पर लगा माखन सब बता रहा था। मैया हँस पड़ीं, छड़ी गिर गई और उन्होंने लाला को गोद में उठा लिया।`,
`ग्वालिनें भी जानती थीं कि उन्हें कान्हा के लिए ही तो माखन रखना है। कई बार वे जान-बूझकर छींका नीचे लटका देतीं और छुपकर देखतीं कि कान्हा कब आएगा। जब कान्हा उनके घर माखन खाता, तो वे अपने आपको धन्य मानतीं। यही नहीं, कान्हा चोरी भी करता तो प्रेम चुराता था। उसकी मुस्कान देखकर किसी का क्रोध टिक नहीं पाता था।`,
`भक्त कहते हैं कि माखन चोरी तो बहाना है। कान्हा असल में हमारे मन का माखन चुराते हैं, यानी हमारा निर्मल प्रेम। जब हम सारे अहंकार छोड़कर प्रेम से कान्हा को याद करते हैं, तो वे सबसे ज़्यादा प्रसन्न होते हैं।`,
`सीख: मिल-बाँटकर खाने से आनंद बढ़ता है, और प्रेम से अर्पित छोटी-सी चीज़ भी भगवान को बहुत प्रिय होती है।`
]},
{ id:"mukh-brahmand", cat:"katha", prose:true, refrain:[5],
  title:{hi:"कान्हा के मुख में ब्रह्मांड", en:"The Universe in Kanha's Mouth"},
  sub:{hi:"मिट्टी खाने की लीला", en:"The mud-eating leela"},
  verses:[
`गोकुल के आँगन में कान्हा अपने बड़े भैया बलराम और ग्वाल-बालों के साथ खेल रहे थे। खेलते-खेलते उन्होंने मिट्टी के ढेले उठाए और एक ढेला अपने मुँह में रख लिया। कुछ बालकों ने यह देख लिया। वे दौड़े-दौड़े यशोदा मैया के पास पहुँचे और बोले, “मैया! कान्हा ने मिट्टी खा ली है।”`,
`मैया बहुत घबरा गईं। उन्हें डर लगा कि मिट्टी खाने से लाला का पेट खराब हो जाएगा। वे हाथ में छड़ी लेकर आईं और कान्हा का हाथ पकड़कर बोलीं, “क्यों रे नटखट, तूने मिट्टी क्यों खाई?” कान्हा डर गए, आँखें भर आईं और बोले, “मैया, मैंने नहीं खाई। ये सब झूठ बोलते हैं। अगर तुझे मेरा विश्वास नहीं तो मेरा मुँह खुद देख ले।”`,
`मैया ने कहा, “अच्छा, मुँह खोल।” कान्हा ने जैसे ही मुँह खोला, यशोदा मैया की आँखें फटी की फटी रह गईं। उस छोटे-से मुख में पूरी सृष्टि दिखाई दे रही थी: आकाश, चाँद-तारे, सूर्य, पर्वत, सागर, सातों द्वीप, देवता, ऋषि, वन-उपवन और पूरा गोकुल भी। उसी गोकुल में उन्हें नंद बाबा का घर दिखा और वहाँ स्वयं अपने आपको भी वे कान्हा को पकड़े हुए देख रही थीं। वे घबरा गईं कि यह मैं क्या देख रही हूँ।`,
`वे सोचने लगीं, “क्या मैं स्वप्न देख रही हूँ, या यह कोई देवता की माया है, या मेरे बालक में कोई दिव्य शक्ति है?” तभी प्रभु ने अपनी योगमाया फैला दी। मैया सब कुछ भूल गईं और फिर वही ममता भाव लौट आया। उन्होंने कान्हा को गोद में उठाकर चूम लिया। वे फिर वही साधारण माँ थीं और कान्हा उनका लाला।`,
`इस लीला से भगवान दिखाते हैं कि वे असीम हैं, फिर भी भक्त के प्रेम के कारण साधारण बालक बनकर माँ की गोद में बैठ जाते हैं।`,
`सीख: जिसे हम छोटा समझते हैं, उसके भीतर भी असीम शक्ति और ज्ञान हो सकता है। इसलिए किसी को कम मत आँको।`
]},
{ id:"kaliya-nag", cat:"katha", prose:true, refrain:[5],
  title:{hi:"कालिया नाग का मान-मर्दन", en:"Krishna and the Serpent Kaliya"},
  sub:{hi:"यमुना जी को विषमुक्त करने की कथा", en:"How Krishna cleansed the Yamuna"},
  verses:[
`वृंदावन के पास यमुना जी में एक गहरा कुंड था जिसमें कालिया नाग रहता था। उसके सौ से भी अधिक फन थे और साँसों में प्रचंड विष। उसके विष की गर्मी से कुंड का जल उबलता रहता था और उसके ऊपर उड़ने वाले पक्षी तक झुलसकर गिर पड़ते थे। किनारे की हरियाली सूख गई थी। ब्रजवासी और उनकी गायें उस ओर जाने से डरते थे।`,
`एक दिन गर्मी में ग्वाल-बाल अपनी गायों के साथ यमुना किनारे पहुँचे। प्यासी गायों और बालकों ने उसी विषैले जल को पी लिया और वे बेहोश होकर गिर पड़े। कान्हा ने अपनी कृपा-दृष्टि से सबको फिर जीवित कर दिया। फिर उन्होंने सोचा कि यह विष यमुना जी को और ब्रजवासियों को हानि पहुँचा रहा है, इसे अब समाप्त करना होगा।`,
`कान्हा ने कमर कसकर कदंब के ऊँचे वृक्ष पर चढ़कर यमुना में छलाँग लगा दी। हलचल से कालिया जाग उठा। वह क्रोध में फुफकारता हुआ आया और उसने कान्हा को अपने कुंडलों में कस लिया। किनारे पर खड़े ग्वाल-बाल रोने लगे और नंद-यशोदा दौड़े आए। पर कान्हा मुस्कुरा रहे थे। उन्होंने अपना शरीर फैलाया, जिससे कालिया की कसावट ढीली पड़ गई और वे बाहर निकल आए।`,
`अब कान्हा कालिया के फनों पर चढ़ गए और बाँसुरी बजाते हुए नृत्य करने लगे। जो फन ऊपर उठता, वे उसे अपने चरणों से झुका देते। कालिया का घमंड चूर हो गया और वह लहूलुहान होकर थक गया। तब उसकी पत्नियाँ नागपत्नियाँ हाथ जोड़कर प्रार्थना करने लगीं, “हे प्रभु! आप तो जगत के स्वामी हैं। हमारे पति को क्षमा कीजिए। हम आपके शरणागत हैं।”`,
`कान्हा ने कहा, “कालिया! तुम अपने परिवार के साथ अब यमुना जी को छोड़कर समुद्र में रमणक द्वीप चले जाओ। तुम्हारे सिर पर मेरे चरणों के निशान रहेंगे, इसलिए गरुड़ तुम्हें कभी नहीं सताएँगे।” कालिया ने प्रणाम किया और चला गया। यमुना जी का जल फिर निर्मल हो गया और सारा ब्रज कान्हा की जय-जयकार से गूँज उठा।`,
`सीख: अहंकार और बुराई कितनी भी बड़ी हो, अच्छाई के सामने उसे झुकना ही पड़ता है। प्रकृति को शुद्ध रखना भी हमारा कर्तव्य है।`
]},
{ id:"govardhan-leela", cat:"katha", prose:true, refrain:[5],
  title:{hi:"गोवर्धन धारण लीला", en:"Lifting Mount Govardhan"},
  sub:{hi:"इंद्र का घमंड और गिरिराज जी", en:"Indra's pride and Giriraj ji"},
  verses:[
`ब्रज में हर वर्ष वर्षा के देवता इंद्र की बड़ी पूजा होती थी। सब लोग दूध-घी-पकवान बनाते और इंद्र को चढ़ाने की तैयारी करते। सात वर्ष के कान्हा ने नंद बाबा से पूछा, “बाबा, यह सब क्यों हो रहा है?” नंद बाबा ने कहा कि इंद्र वर्षा करते हैं, जिससे अन्न और घास उपजती है। कान्हा मुस्कुराकर बोले, “बाबा, हम किसान और ग्वाले हैं। हमारी गायें गोवर्धन पर्वत पर चरती हैं, वहीं से हमें जल, फल, फूल और छाया मिलती है। हमें गोवर्धन पर्वत और गायों की पूजा करनी चाहिए।”`,
`नंद बाबा और बड़ों को कान्हा की बात ठीक लगी। सबने गोवर्धन की पूजा की, अन्नकूट बनाया और परिक्रमा की। कान्हा ने विशाल रूप धारण करके स्वयं भी भोग स्वीकार किया। जब इंद्र को पता चला तो वह क्रोध से लाल हो गया। उसे लगा कि एक छोटा-सा ग्वाला बालक उसका अपमान कर रहा है। उसने सांवर्तक नाम के प्रलयकारी बादलों को आज्ञा दी कि ब्रज को बहा दो।`,
`आकाश में घनघोर काले बादल घिर आए। मूसलाधार वर्षा, आँधी, बिजली और ओले बरसने लगे। गायें, बछड़े और गोप-गोपियाँ भय से काँपने लगे। सब दौड़कर कान्हा के पास आए और बोले, “कान्हा! हमारी रक्षा करो।” कान्हा ने कहा, “डरो मत। चलो, गोवर्धन पर्वत की शरण में।” फिर उन्होंने अपने बाएँ हाथ की छोटी उँगली पर विशाल गोवर्धन पर्वत को उठा लिया, जैसे कोई बालक छत्ता उठाता हो।`,
`सारे ब्रजवासी अपनी गायों, बछड़ों और सामान के साथ पर्वत के नीचे आ गए। सात दिन और सात रात लगातार वर्षा होती रही, पर कान्हा बिना हिले-डुले मुस्कुराते खड़े रहे। न भूख, न प्यास, न थकान। ग्वाल-बाल अपनी लाठियाँ भी पर्वत को सहारा देने के लिए लगाते और आनंद करते। इंद्र का सारा बल व्यर्थ गया और बादलों का पानी खत्म हो गया।`,
`तब इंद्र को समझ आया कि यह साधारण बालक नहीं, स्वयं परमात्मा हैं। वह शर्मिंदा होकर कामधेनु गाय के साथ आया, चरणों में गिरकर क्षमा माँगी और कान्हा का अभिषेक किया। कान्हा ने पर्वत को पहले की जगह रख दिया। तभी से कान्हा को गिरिधारी या गोवर्धनधारी कहा जाने लगा और आज भी कार्तिक में गोवर्धन पूजा और अन्नकूट का उत्सव मनाया जाता है।`,
`सीख: घमंड सबसे बड़ा शत्रु है। जो अपने सहारे रहने वालों की रक्षा करता है, भगवान उसकी रक्षा करते हैं। साथ मिलकर हर संकट का सामना किया जा सकता है।`
]},
{ id:"sudama-mitrata", cat:"katha", prose:true, refrain:[5],
  title:{hi:"कृष्ण-सुदामा की मित्रता", en:"Krishna and Sudama's Friendship"},
  sub:{hi:"सच्ची मित्रता की कथा", en:"A story of true friendship"},
  verses:[
`उज्जैन के संदीपनि मुनि के आश्रम में कृष्ण और सुदामा साथ-साथ पढ़ते थे। सुदामा ग़रीब ब्राह्मण परिवार के थे और कृष्ण राजकुमार। फिर भी दोनों में गहरी दोस्ती थी। एक बार गुरुमाता ने दोनों को जंगल से लकड़ी लाने भेजा और रास्ते के लिए चने दिए। जंगल में तेज़ बारिश हुई और वे एक पेड़ पर रात बिताने लगे। भूख लगी तो सुदामा ने अकेले ही चने खा लिए और कृष्ण को बताया तक नहीं। बाद में कृष्ण को इस बात का पता चला, पर उन्होंने कभी इसकी शिकायत नहीं की।`,
`समय बीता। पढ़ाई पूरी हुई और दोनों अपने-अपने रास्ते चले गए। कृष्ण द्वारका के राजा बने और सुदामा एक गाँव में गृहस्थ का जीवन जीने लगे। उनके घर में अक्सर चूल्हा तक न जलता था। बच्चे भूखे सोते। पत्नी सुशीला ने एक दिन कहा, “आप कहते थे कि द्वारकाधीश कृष्ण आपके मित्र हैं। एक बार उनसे मिल आइए।” सुदामा संकोच से बोले, “मैं उनसे कुछ माँगने नहीं जा सकता।” पर पत्नी के कहने पर वे मिलने चल पड़े। उन्होंने पड़ोस से माँगकर थोड़े चिवड़े (पोहा) एक पोटली में बाँध लिए।`,
`द्वारका का वैभव देखकर सुदामा हैरान रह गए। वे द्वार पर पहुँचे तो पहरेदार ने पूछा कि तुम कौन हो। सुदामा ने डरते हुए कहा, “कृष्ण का मित्र सुदामा।” संदेश सुनते ही कृष्ण नंगे पैर दौड़ पड़े। उन्होंने सुदामा को हृदय से लगा लिया और उन्हें अपने सिंहासन पर बैठाया। रुक्मिणी जी चँवर डुलाने लगीं। कृष्ण ने सुदामा के फटे पैरों को देखकर रोते हुए अपने हाथों से उन्हें धोया। इतना देखकर दरबार के लोग भी भावुक हो गए।`,
`कृष्ण ने हँसते हुए पूछा, “भाभी ने मेरे लिए क्या भेजा है?” सुदामा शरमा गए और पोटली छिपाने लगे। कृष्ण ने उसे खींच लिया और बड़े प्रेम से मुट्ठी भर चिवड़े खाए। जब दूसरी मुट्ठी उठाई तो रुक्मिणी जी ने उनका हाथ पकड़ लिया। सुदामा कुछ माँग ही नहीं पाए। वे कुछ दिन द्वारका में रहे, फिर बिना कुछ कहे घर की ओर चल दिए। रास्ते भर वे सोचते रहे कि पत्नी को क्या जवाब दूँगा।`,
`गाँव पहुँचकर वे चौंक गए। उनकी झोपड़ी की जगह एक सुंदर महल खड़ा था। उनकी पत्नी और बच्चे सुंदर वस्त्र पहने उनके स्वागत में थे। सुदामा की आँखों में आँसू आ गए। उन्हें समझ आ गया कि कृष्ण ने बिना कहे सब कुछ दे दिया था। उसके बाद भी सुदामा पहले की तरह विनम्र रहे और कृष्ण भक्ति में लगे रहे।`,
`सीख: सच्चा मित्र धन या पद नहीं देखता, केवल प्रेम देखता है। बिना माँगे दूसरों के काम आना ही सच्ची मित्रता है।`
]},
{ id:"putana-udhar", cat:"katha", prose:true, refrain:[4],
  title:{hi:"पूतना उद्धार", en:"Liberation of Putana"},
  sub:{hi:"श्रीमद्भागवत, दशम स्कंध की कथा", en:"From the Bhagavatam, Canto 10"},
  verses:[
`जब कंस को पता चला कि उसका काल कहीं जन्म ले चुका है, तो उसने आदेश दिया कि पूरे क्षेत्र में जन्मे सभी नवजात शिशुओं को मार दिया जाए। इस काम के लिए उसने अपनी क्रूर राक्षसी पूतना को चुना। पूतना जादू से रूप बदल सकती थी। उसने एक अत्यंत सुंदर, ममतामयी स्त्री का रूप धारण किया और गोकुल की ओर चल पड़ी।`,
`गोकुल पहुँचकर वह नंद बाबा के महल में पहुँची। उसके सौंदर्य और मीठे व्यवहार से सब मोहित हो गए। किसी ने उसे रोका नहीं। वह सीधे यशोदा मैया के कमरे में गई, जहाँ कान्हा पालने में सो रहे थे। वह बोली, “कितना सुंदर बालक है! मैं इसे गोद में लेकर दूध पिलाना चाहती हूँ।” भोली यशोदा उसकी बातों में आ गईं और उन्होंने बालक उसकी गोद में दे दिया।`,
`पूतना ने अपने स्तनों पर घातक विष लगा रखा था। उसने कान्हा को दूध पिलाना शुरू किया। पर कान्हा सब कुछ जानते थे। उन्होंने उसका दूध पीते-पीते उसके प्राण भी खींचने शुरू कर दिए। पूतना पीड़ा से चीख उठी, “छोड़ दे मुझे, छोड़ दे!” वह भागी, पर कान्हा नहीं छूटे। अंत में वह अपने असली, विशाल राक्षसी रूप में ज़मीन पर गिर पड़ी और उसके भार से कई वृक्ष टूट गए।`,
`ब्रजवासी भागकर आए तो देखा कि विशाल पूतना के वक्ष पर नन्हे कान्हा निर्भय होकर खेल रहे हैं। गोपियों ने तुरंत उन्हें गोद में उठाकर गोमूत्र, गोधूलि और गाय की पूँछ से झाड़ा-फूँका और रक्षा के मंत्र पढ़े। भागवत में कहा गया है कि पूतना के कर्म बुरे थे, पर उसने कान्हा को माँ की तरह दूध पिलाया, इसलिए भगवान ने उसे उत्तम गति प्रदान की।`,
`सीख: भगवान की कृपा शत्रु का भी कल्याण कर देती है। अजनबियों की मीठी बातों में आँखें मूँदकर भरोसा नहीं करना चाहिए।`
]},
{ id:"damodar-leela", cat:"katha", prose:true, refrain:[5],
  title:{hi:"दामोदर लीला", en:"The Damodar Leela"},
  sub:{hi:"मैया यशोदा का प्रेम-बंधन", en:"Mother Yashoda's bond of love"},
  verses:[
`कार्तिक मास का समय था। दीपावली का दिन था और यशोदा मैया घर के नौकरों को भी छुट्टी देकर स्वयं माखन मथ रही थीं। वे दही मथते हुए अपने लाला की बाल लीलाओं के गीत गुनगुना रही थीं। तभी कान्हा आए, भूख लगी थी और वे मैया की गोद में चढ़कर दूध माँगने लगे। मैया ने प्रेम से उन्हें दूध पिलाना शुरू किया।`,
`तभी चूल्हे पर रखा दूध उफनने लगा। मैया ने कान्हा को गोद से उतार दिया और दूध सँभालने दौड़ीं। अधूरी भूख से कान्हा को गुस्सा आ गया। उन्होंने पत्थर से मटका फोड़ा, दही-माखन बिखेर दिया और अंदर जाकर माखन खाने लगे, बंदरों को भी खिलाने लगे। लौटकर मैया ने टूटा मटका देखा तो समझ गईं कि यह कान्हा का काम है। वे छड़ी लेकर उन्हें ढूँढ़ने निकलीं।`,
`कान्हा आगे-आगे भागते रहे और मैया पीछे-पीछे। योगियों को भी जो न मिलें, वे आज अपनी माँ के हाथों पकड़े गए। मैया ने उन्हें डाँटा और ओखली से बाँधने के लिए रस्सी लाईं। पर रस्सी दो अंगुल छोटी निकली। उन्होंने और रस्सी जोड़ी, पर तब भी दो अंगुल कम पड़ी। जितनी बार जोड़ती गईं, हर बार दो अंगुल की कमी रही। सारा घर रस्सियों से भर गया, पर कान्हा बँधे नहीं।`,
`मैया पसीने से भीग गईं और थककर बैठ गईं। उनकी ममता और परिश्रम देखकर कान्हा का हृदय पिघल गया। उन्होंने कृपा करके स्वयं को बँध जाने दिया। इस तरह वे पेट पर रस्सी बाँधे जाने के कारण दामोदर (दाम = रस्सी, उदर = पेट) कहलाए। भगवान को न योग से बाँधा जा सकता है, न तप से। उन्हें केवल प्रेम के बंधन में बाँधा जा सकता है।`,
`मैया घर के काम में लग गईं। तब कान्हा ओखली को घसीटते हुए आँगन में लगे दो विशाल अर्जुन वृक्षों के बीच से निकले। ओखली अटक गई। कान्हा ने ज़ोर लगाया और दोनों वृक्ष धड़ाम से गिर पड़े। उनमें से दो दिव्य यक्ष कुबेर-पुत्र नलकूबर और मणिग्रीव निकले, जिन्हें नारद जी के शाप से वृक्ष बनना पड़ा था। उन्होंने हाथ जोड़कर स्तुति की और शाप से मुक्त होकर चले गए। इस तरह एक नटखट लीला से भी भगवान ने भक्तों का उद्धार कर दिया।`,
`सीख: भगवान किसी बल से नहीं, केवल प्रेम से वश में आते हैं। माता का परिश्रम और ममता कभी व्यर्थ नहीं जाता।`
]},
{ id:"kans-vadh", cat:"katha", prose:true, refrain:[5],
  title:{hi:"कंस वध", en:"The Defeat of Kansa"},
  sub:{hi:"अत्याचार का अंत", en:"The end of tyranny"},
  verses:[
`कान्हा और बलराम अब किशोर हो गए थे। कंस ने उन्हें मारने के लिए पहले ही कई राक्षस भेजे थे: बकासुर, अघासुर, तृणावर्त जैसे। पर कान्हा ने सबका अंत कर दिया। अब कंस ने अंतिम चाल चली। उसने मथुरा में धनुष यज्ञ का आयोजन किया और अक्रूर जी को भेजकर कृष्ण-बलराम को निमंत्रण दिया। उसकी योजना थी कि मथुरा में ही उन्हें मरवा दिया जाए।`,
`गोकुल से विदा लेते समय पूरा ब्रज रो पड़ा। यशोदा मैया, नंद बाबा, राधा रानी और गोपियाँ बहुत व्याकुल थीं। कान्हा ने सबको वचन दिया कि वे लौटकर आएँगे और अक्रूर जी के साथ रथ में बैठकर मथुरा चल पड़े। मथुरा पहुँचकर नगर की सुंदरता देखते हुए वे आगे बढ़े। रास्ते में कंस के धोबी ने उनका अपमान किया, तो कान्हा ने उसे दंड दिया। फिर दर्ज़ी और सुदामा नाम के माली ने प्रेम से उनका सत्कार किया और कृष्ण ने उन्हें आशीर्वाद दिया। कुब्जा नाम की कुबड़ी स्त्री ने चंदन लगाया तो कृष्ण ने कृपा से उसे सीधा कर दिया।`,
`यज्ञशाला में पहुँचकर कान्हा ने बिना प्रयास के कंस के विशाल धनुष को उठाकर तोड़ डाला। धनुष टूटने का भयंकर नाद सुनकर कंस काँप उठा। उसने रक्षकों को भेजा, पर कान्हा-बलराम ने सबको परास्त कर दिया। अगले दिन अखाड़े में कंस ने कुवलयापीड़ नाम का मदमस्त हाथी द्वार पर खड़ा कर दिया। कृष्ण ने उसके दाँत उखाड़कर उसे मार गिराया और उन्हीं दाँतों को कंधे पर रखकर अखाड़े में पहुँचे।`,
`अखाड़े में कंस के महाबली पहलवान चाणूर और मुष्टिक ने उन्हें ललकारा। कान्हा ने चाणूर से और बलराम ने मुष्टिक से कुश्ती लड़ी। थोड़ी ही देर में दोनों असुर परास्त होकर मारे गए। यह देखकर कंस क्रोध से काँपने लगा और बोला कि इन दोनों को सभा से बाहर निकाल दो। तब कान्हा उछलकर ऊँचे मंच पर पहुँचे, कंस के केश पकड़कर उसे सिंहासन से नीचे खींच लिया और उसका अंत कर दिया।`,
`कंस के वध के बाद कृष्ण-बलराम ने माता देवकी और पिता वसुदेव के चरण छूकर उन्हें कारागार से मुक्त कराया। उन्होंने कंस के पिता, वृद्ध राजा उग्रसेन को फिर से मथुरा का राजा बना दिया और स्वयं नम्रता से सेवक की तरह रहे। इस तरह वर्षों के अत्याचार का अंत हुआ और मथुरा में फिर धर्म का राज स्थापित हुआ।`,
`सीख: अन्याय और अत्याचार कितना भी शक्तिशाली हो, अंत में धर्म की ही जीत होती है।`
]},
{ id:"draupadi-laj", cat:"katha", prose:true, refrain:[5],
  title:{hi:"द्रौपदी की लाज", en:"Krishna Saves Draupadi"},
  sub:{hi:"महाभारत की कथा", en:"A story from the Mahabharata"},
  verses:[
`महाभारत की कथा में हस्तिनापुर की राजसभा में जुए का खेल चल रहा था। दुर्योधन ने अपने मामा शकुनि की चाल से युधिष्ठिर को खेल में फँसाया। युधिष्ठिर एक-एक करके अपना धन, राज्य, भाइयों और स्वयं को भी हार गए। अंत में उन्होंने द्रौपदी को भी दाँव पर लगा दिया और वह भी हार गए।`,
`दुर्योधन ने अपने भाई दुःशासन को आदेश दिया कि द्रौपदी को सभा में खींच लाओ। द्रौपदी ने कहा कि मैं रजस्वला हूँ और एक वस्त्र में हूँ, मुझे सभा में न ले जाओ। पर दुःशासन ने उनके केश पकड़कर उन्हें घसीटा और भरी सभा में लाकर खड़ा कर दिया। सभा में भीष्म, द्रोण, विदुर, धृतराष्ट्र जैसे बड़े-बड़े लोग बैठे थे, पर सबने सिर झुका लिया। पाँचों पांडव भी विवश थे।`,
`द्रौपदी ने बहुत विनती की, सबसे न्याय माँगा, पर किसी ने उनकी रक्षा नहीं की। तब दुःशासन ने उनकी साड़ी खींचनी शुरू कर दी। द्रौपदी ने पहले तो अपने हाथों से साड़ी पकड़ने का प्रयास किया। पर जब हर सहारा टूट गया, तब उन्होंने दोनों हाथ ऊपर उठा लिए और पूरे विश्वास से पुकारा, “हे गोविंद! हे द्वारकावासी कृष्ण! मुझे बचाओ!”`,
`कृष्ण तुरंत उस पुकार के साथ पहुँच गए। उनकी कृपा से द्रौपदी की साड़ी बढ़ती चली गई। दुःशासन साड़ी खींचता गया और साड़ी का ढेर लगता गया। वह हज़ारों हाथियों के बल वाला था, पर थककर पसीने में डूब गया और जमीन पर गिर पड़ा। साड़ी का अंत नहीं हुआ। सभा में सब चकित रह गए और द्रौपदी की लाज रह गई।`,
`जब कृष्ण ने बाद में द्रौपदी से मुलाकात की तो उन्होंने कहा कि जब तक तुम हाथों के बल पर बचने की कोशिश कर रही थीं, तब तक मैं नहीं आया। जब तुमने सब कुछ छोड़कर केवल मुझ पर भरोसा किया, तभी मैं आ सका। सच्ची प्रार्थना में अपने बल का अभिमान नहीं, पूरा समर्पण होता है।`,
`सीख: सच्चे मन और पूरे भरोसे से पुकारने पर भगवान अवश्य सहारा देते हैं। नारी का सम्मान सबसे बड़ा धर्म है।`
]},
{ id:"gita-updesh", cat:"katha", prose:true, refrain:[5],
  title:{hi:"गीता का उपदेश", en:"The Teaching of the Gita"},
  sub:{hi:"कुरुक्षेत्र में अर्जुन को ज्ञान", en:"Arjuna's guidance at Kurukshetra"},
  verses:[
`महाभारत का युद्ध अब टल नहीं सकता था। कुरुक्षेत्र के मैदान में दोनों सेनाएँ आमने-सामने खड़ी थीं। एक ओर कौरवों की ग्यारह अक्षौहिणी सेना, दूसरी ओर पांडवों की सात अक्षौहिणी। युद्ध से पहले अर्जुन ने अपने सारथी श्री कृष्ण से कहा, “हे अच्युत! मेरा रथ दोनों सेनाओं के बीच ले चलिए, मैं देखना चाहता हूँ कि कौन-कौन मुझसे युद्ध करने आया है।”`,
`कृष्ण ने रथ बीच में ले जाकर खड़ा कर दिया। अर्जुन ने देखा कि सामने उनके पितामह भीष्म, गुरु द्रोणाचार्य, कृपाचार्य, चाचा, भाई, मित्र और संबंधी खड़े हैं। उनका शरीर काँपने लगा, मुँह सूख गया, हाथ से गांडीव धनुष छूटकर गिर पड़ा। वे बोले, “कृष्ण! मैं इन्हें मारकर राज्य नहीं चाहता। इससे अच्छा तो मैं भिक्षा माँगकर जी लूँ।” इतना कहकर वे रथ के पिछले भाग में बैठ गए और उनकी आँखों से आँसू बहने लगे।`,
`तब कृष्ण ने हँसकर कहा, “अर्जुन! जो शोक करने योग्य नहीं है, उसके लिए तुम शोक कर रहे हो। आत्मा न कभी जन्म लेती है, न मरती है। जैसे मनुष्य पुराने वस्त्र छोड़कर नए पहनता है, वैसे ही आत्मा पुराना शरीर छोड़कर नया धारण करती है। इसे न शस्त्र काट सकते हैं, न अग्नि जला सकती है, न जल गला सकता है।” फिर उन्होंने कर्म का रहस्य समझाया।`,
`उन्होंने कहा, “तुम्हारा अधिकार केवल कर्म करने में है, फल में कभी नहीं। इसलिए फल की इच्छा से कर्म मत करो और कर्म न करने में भी आसक्त मत हो।” उन्होंने कर्मयोग, ज्ञानयोग और भक्तियोग तीनों का मार्ग बताया। कहा कि जो भक्त मुझ पर पूरा विश्वास रखता है और अपना हर कार्य मुझे अर्पित करता है, उसका योग और क्षेम मैं स्वयं वहन करता हूँ।`,
`जब अर्जुन ने कहा कि मैं आपका वास्तविक रूप देखना चाहता हूँ, तब कृष्ण ने उन्हें दिव्य नेत्र दिए और अपना विश्वरूप दिखाया। उसमें असंख्य मुख, नेत्र, शस्त्र, देवता, सूर्य, चंद्र और संपूर्ण सृष्टि समाई थी। अर्जुन भयभीत होकर और हाथ जोड़कर स्तुति करने लगे। अंत में उनका सारा मोह दूर हो गया और वे बोले, “आपकी कृपा से मेरा संशय मिट गया है। अब मैं आपकी आज्ञा का पालन करूँगा।” यही संवाद आगे चलकर श्रीमद्भगवद्गीता कहलाया।`,
`सीख: अपना कर्तव्य ईमानदारी से करो और फल भगवान पर छोड़ दो। मुश्किल समय में घबराकर भागने के बजाय सही मार्गदर्शन सुनो।`
]},
{ id:"shanti-doot", cat:"katha", prose:true, refrain:[5],
  title:{hi:"शांतिदूत श्री कृष्ण", en:"Krishna as Peace Envoy"},
  sub:{hi:"युद्ध रोकने का आख़िरी प्रयास", en:"The last attempt to prevent war"},
  verses:[
`तेरह वर्ष के वनवास और अज्ञातवास के बाद पांडव अपने राज्य का हिस्सा माँगने लगे। पर दुर्योधन ने कह दिया कि मैं बिना युद्ध के उन्हें सुई की नोक के बराबर भूमि भी नहीं दूँगा। पांडव युद्ध नहीं चाहते थे। इसलिए उन्होंने श्री कृष्ण से प्रार्थना की कि वे शांति का प्रस्ताव लेकर हस्तिनापुर जाएँ। कृष्ण ने कहा कि मैं अंतिम प्रयत्न अवश्य करूँगा, ताकि कोई यह न कहे कि शांति का प्रयास नहीं हुआ।`,
`कृष्ण हस्तिनापुर पहुँचे तो धृतराष्ट्र, भीष्म, द्रोण और विदुर ने सम्मान से उनका स्वागत किया। दुर्योधन ने भोजन का निमंत्रण दिया, पर कृष्ण ने मना कर दिया और कहा कि भोजन तभी स्वीकार होता है जब मन में प्रेम हो और संकट में कोई निमंत्रण दे। वे विदुर जी की कुटिया में गए और उनके घर साधारण साग-भाजी बड़े प्रेम से खाई।`,
`राजसभा में कृष्ण ने नम्रता से कहा कि पांडवों को पूरा राज्य नहीं, केवल पाँच गाँव दे दीजिए: इंद्रप्रस्थ, वृकप्रस्थ, जयंत, वारणावत और एक कोई और। इससे युद्ध टल जाएगा और लाखों प्राण बच जाएँगे। भीष्म, द्रोण और विदुर ने भी दुर्योधन को समझाया। पर दुर्योधन ने घमंड में कहा, “मैं पाँच गाँव तो क्या, सुई की नोक के बराबर भूमि भी नहीं दूँगा।”`,
`जब दुर्योधन ने कृष्ण को बंदी बनाने का षड्यंत्र रचा, तब कृष्ण हँस पड़े और उन्होंने अपना विराट रूप प्रकट कर दिया। उसमें सब देवता, ऋषि, सृष्टि और स्वयं काल दिखाई देने लगे। पूरी सभा भय से काँप उठी। केवल धृतराष्ट्र को, जो नेत्रहीन थे, कृपा करके दिव्य दृष्टि दी गई। पर दुर्योधन का अहंकार फिर भी न टूटा।`,
`निराश होकर कृष्ण लौट आए। उन्होंने पांडवों को सब बताया और कहा कि अब युद्ध ही धर्म की रक्षा का मार्ग है। इसका अर्थ है कि शांति के हर रास्ते अपनाने के बाद ही धर्म की रक्षा के लिए शस्त्र उठाना चाहिए।`,
`सीख: पहले शांति और समझदारी का रास्ता अपनाओ, पर अन्याय के सामने झुकना भी मत।`
]},
{ id:"ras-leela", cat:"katha", prose:true, refrain:[5],
  title:{hi:"रास लीला", en:"The Maha Raas Leela"},
  sub:{hi:"शरद पूर्णिमा की रात का दिव्य नृत्य", en:"The divine dance of Sharad Purnima"},
  verses:[
`शरद पूर्णिमा की रात थी। चाँदनी वृंदावन के वन में फैली थी और यमुना जी की रेती चाँदी-सी चमक रही थी। कान्हा ने अपनी बाँसुरी उठाई और उसमें मधुर तान छेड़ी। वह बाँसुरी की मधुर आवाज़ दूर-दूर तक फैल गई। गोपियाँ अपने घर के कामकाज, पति और परिवार छोड़कर कान्हा की ओर खिंचती चली आईं। कोई भोजन छोड़कर आई, कोई दूध छोड़कर।`,
`कान्हा ने मुस्कुराकर पूछा, “इतनी रात गए वन में क्यों आईं? घर लौट जाओ, तुम्हारे घरवाले चिंता करेंगे।” गोपियों ने कहा, “प्रभु! आपने ही तो बाँसुरी बजाकर हमें बुलाया है। अब हम आपके चरणों को छोड़कर कहीं नहीं जाएँगी।” उनका सच्चा प्रेम देखकर कान्हा बहुत प्रसन्न हुए और रास लीला आरंभ हुई।`,
`रास के आनंद में गोपियों को थोड़ा अभिमान हो गया कि कान्हा केवल हमारे साथ हैं। उसी क्षण कान्हा अंतर्धान हो गए। गोपियाँ व्याकुल होकर वन में, पेड़ों और लताओं से पूछती हुई खोजने लगीं, “क्या तुमने हमारे कान्हा को देखा?” वे रोईं, गीत गाए, कान्हा की लीलाओं का स्मरण किया। इस विरह-गान को “गोपी गीत” कहा जाता है।`,
`जब गोपियों का अहंकार पूरी तरह मिट गया और केवल प्रेम रह गया, तो कान्हा फिर प्रकट हो गए। फिर महारास शुरू हुआ। कान्हा ने ऐसी लीला की कि हर दो गोपियों के बीच एक कान्हा खड़े दिखाई दिए और सब यही समझती रहीं कि कान्हा उन्हीं के साथ नृत्य कर रहे हैं। वह रात इतनी लंबी हो गई कि ब्रह्मा जी की रात के बराबर बीती।`,
`रास लीला कोई साधारण नृत्य नहीं। इसमें आत्मा और परमात्मा के मिलन का रहस्य है। जब भक्त अहंकार छोड़कर केवल प्रेम से प्रभु को पुकारता है, तो भगवान स्वयं उसके पास आ जाते हैं।`,
`सीख: जहाँ अहंकार होता है, वहाँ प्रभु नहीं ठहरते। निर्मल प्रेम ही भक्ति का सार है।`
]},
{ id:"rukmini-vivah", cat:"katha", prose:true, refrain:[5],
  title:{hi:"रुक्मिणी विवाह", en:"The Marriage of Rukmini"},
  sub:{hi:"विदर्भ की राजकुमारी की कथा", en:"The princess of Vidarbha"},
  verses:[
`विदर्भ देश के राजा भीष्मक की सुपुत्री रुक्मिणी बहुत सुंदर और गुणवान थीं। वे द्वारकाधीश कृष्ण के गुणों की चर्चा सुनकर मन-ही-मन उन्हें अपना पति मान चुकी थीं। पर उनका भाई रुक्मी कृष्ण से द्वेष रखता था और उसने रुक्मिणी का विवाह चेदिराज शिशुपाल से तय कर दिया। रुक्मिणी बहुत दुखी हुईं।`,
`जब कोई उपाय न बचा, तो रुक्मिणी ने एक विश्वासी ब्राह्मण के हाथ कृष्ण को पत्र भेजा। उसमें लिखा था, “हे प्रभु! मैंने सुना है कि आप सबके हृदय की बात जानते हैं। मैंने आपको अपना पति चुन लिया है। विवाह से पहले दिन मैं नगर के बाहर देवी मंदिर में दर्शन के लिए आऊँगी। आप आकर मुझे ले जाइए, वरना मैं प्राण त्याग दूँगी।” ब्राह्मण तेज़ी से द्वारका पहुँचे और पत्र कृष्ण को दिया।`,
`कृष्ण ने पत्र पढ़कर कहा, “रुक्मिणी जैसा मेरे मन में बसती है, वैसे ही मैं भी उसी के बारे में सोचता हूँ।” वे उसी समय रथ पर बैठकर विदर्भ के लिए निकल पड़े। विवाह के दिन रुक्मिणी जी देवी अंबिका के मंदिर पूजा करने गईं। पूजा करके जैसे ही वे बाहर निकलीं, कृष्ण ने उनका हाथ पकड़कर उन्हें अपने रथ पर बिठा लिया और द्वारका की ओर चल दिए।`,
`शिशुपाल, जरासंध और रुक्मी की सेनाओं ने पीछा किया। बलराम और यादव सेना ने उन्हें रोका और उनकी सेना को परास्त कर दिया। रुक्मी कृष्ण से युद्ध करने आया, पर हार गया। कृष्ण उसे मार डालते, पर रुक्मिणी ने भाई के प्राणों की भीख माँगी और कृष्ण ने उसे जीवित छोड़ दिया।`,
`द्वारका में बड़े धूमधाम से कृष्ण और रुक्मिणी का विवाह हुआ। रुक्मिणी जी साक्षात लक्ष्मी जी का रूप थीं और हर क्षण प्रभु की भक्ति में लीन रहती थीं। यही कारण है कि कृष्ण के साथ पूजा में रुक्मिणी जी का भी नाम लिया जाता है।`,
`सीख: सच्चे मन से की गई प्रार्थना और विश्वास कभी व्यर्थ नहीं जाते। अपने से प्रेम करने वालों का मान रखना चाहिए।`
]},
{ id:"brahma-moh", cat:"katha", prose:true, refrain:[5],
  title:{hi:"ब्रह्मा जी का मोह-भंग", en:"Brahma Meets the Little Cowherd"},
  sub:{hi:"ग्वाल-बाल और बछड़ों की लीला", en:"The leela of the cowherd boys and calves"},
  verses:[
`एक दिन कान्हा अपने मित्र ग्वाल-बालों और बछड़ों के साथ यमुना किनारे वन-भोज (पिकनिक) कर रहे थे। सब अपने-अपने घर से लाया खाना कमल-पत्तों पर सजाकर बैठे थे। कान्हा बीच में बैठे थे और मित्र उनके चारों ओर गोल घेरे में। कोई अपनी दही-भात की पोटली दिखा रहा था, कोई कान्हा को अपने हाथ से निवाला खिला रहा था। आकाश से ब्रह्मा जी यह दृश्य देख रहे थे।`,
`ब्रह्मा जी ने सोचा, “यह साधारण ग्वाला बालक भगवान कैसे हो सकता है? जो झूठे हाथों से खाता है, मित्रों के साथ खेलता है।” परीक्षा लेने के लिए उन्होंने चुपके से सारे बछड़ों और ग्वाल-बालों को उठाकर एक गुफा में छिपा दिया। कान्हा को यह सब पता चल गया, पर वे मुस्कुराए और चुप रहे।`,
`वन-भोज के बाद जब कान्हा ने देखा कि कोई बालक या बछड़ा नहीं है, तो उन्होंने सोचा कि यदि मैं अकेला घर गया तो माताओं को दुख होगा। इसलिए कान्हा स्वयं ही सारे बछड़े और सारे ग्वाल-बालों के रूप में प्रकट हो गए। उन्हीं की वही वेशभूषा, वही आदतें, वही बोली थी। वे सब अपने-अपने घर पहुँचे। माताओं ने अपने बच्चों को पहले से भी ज़्यादा प्यार से गोद में उठाया।`,
`एक वर्ष बीत गया। इधर ब्रह्मा जी लौटे तो देखा कि सारे बालक और बछड़े पहले की तरह खेल रहे हैं। वे घबरा गए, “अरे! मेरे चुराए बालक तो गुफा में हैं, फिर ये कौन हैं?” जब ब्रह्मा जी ने ध्यान से देखा तो हर बालक और बछड़े का रूप चतुर्भुज विष्णु भगवान का था, शंख-चक्र-गदा-पद्म धारण किए हुए। सबकी सेवा में देवता, ऋषि और माया खड़ी थीं।`,
`ब्रह्मा जी का मोह टूट गया। वे दौड़कर कान्हा के चरणों में गिर पड़े और बोले, “प्रभु! मैंने आपकी महिमा को नहीं पहचाना। मुझे क्षमा कर दीजिए।” कान्हा ने मुस्कुराकर उन्हें क्षमा कर दिया। गुफा के सभी बालक और बछड़े ब्रह्मा जी ने कान्हा को लौटा दिए।`,
`सीख: किसी को उसके रूप या सादगी से कम मत समझो। सच्ची शक्ति अक्सर विनम्रता में छिपी होती है।`
]},
{ id:"bhishma-sudarshan", cat:"katha", prose:true, refrain:[5],
  title:{hi:"भीष्म की प्रतिज्ञा और कृष्ण का चक्र", en:"Bhishma's Vow and Krishna's Wheel"},
  sub:{hi:"कुरुक्षेत्र का रोमांचक प्रसंग", en:"A thrilling moment at Kurukshetra"},
  verses:[
`महाभारत के युद्ध से पहले कृष्ण ने प्रतिज्ञा की थी कि वे इस युद्ध में शस्त्र नहीं उठाएँगे और केवल अर्जुन के सारथी बनेंगे। पर पितामह भीष्म ने भी दुर्योधन के सामने प्रतिज्ञा ली थी कि “मैं या तो पांडवों को मार दूँगा, या कृष्ण को शस्त्र उठाने पर मजबूर कर दूँगा।”`,
`युद्ध के कई दिन बीत गए। भीष्म पितामह का पराक्रम देखकर पांडवों की सेना काँप उठी। एक दिन भीष्म ने ऐसे भीषण बाण बरसाए कि अर्जुन का रथ अस्त-व्यस्त हो गया। अर्जुन पितामह पर पूरी शक्ति से बाण नहीं चला पा रहे थे। उनके मन में गुरु और पितामह के प्रति आदर था। बाणों की वर्षा से कृष्ण भी घायल हो गए।`,
`यह देखकर कृष्ण को क्रोध आ गया। वे रथ से कूद पड़े और रथ का एक पहिया उठाकर अपना सुदर्शन चक्र समझकर भीष्म की ओर दौड़ पड़े। भीष्म ने धनुष नीचे रख दिया, हाथ जोड़कर बोले, “हे गोविंद! आइए, मुझे मार डालिए। आपके हाथों से मेरी मृत्यु होगी तो यह मेरा परम सौभाग्य होगा।”`,
`अर्जुन दौड़कर कृष्ण के चरणों में गिर गए और बोले, “हे केशव! आप अपनी प्रतिज्ञा मत तोड़िए। मैं वचन देता हूँ कि मैं पूरी शक्ति से युद्ध करूँगा।” कृष्ण शांत हुए और फिर रथ पर लौट आए। भीष्म की प्रतिज्ञा भी पूरी हुई, क्योंकि उन्होंने कृष्ण को शस्त्र उठाने पर विवश कर दिया था। और कृष्ण की प्रतिज्ञा भी निभी, क्योंकि उन्होंने वास्तव में चक्र का प्रयोग नहीं किया।`,
`इस प्रसंग से हम सीखते हैं कि भगवान अपने भक्त की प्रतिज्ञा का भी मान रखते हैं।`,
`सीख: भगवान अपने भक्तों का मान सदा रखते हैं, और भक्त का प्रेम भगवान को भी झुका देता है।`
]},
{ id:"janmashtami", cat:"parv", prose:true,
  title:{hi:"श्री कृष्ण जन्माष्टमी", en:"Shri Krishna Janmashtami"},
  sub:{hi:"भगवान के प्राकट्य का महोत्सव", en:"The festival of Krishna's birth"},
  verses:[
`# तिथि और महत्व`,
`जन्माष्टमी भाद्रपद (भादों) मास के कृष्ण पक्ष की अष्टमी को मनाई जाती है, जब रोहिणी नक्षत्र में आधी रात को मथुरा के कारागार में श्री कृष्ण प्रकट हुए थे। तारीख हर वर्ष बदलती है, इसलिए सही दिन और पूजा का मुहूर्त पंचांग में देख लें। यह दिन अधर्म पर धर्म की विजय और भक्त पर भगवान की कृपा का उत्सव है। कथा के लिए “श्री कृष्ण जन्म” वाली कथा पढ़ें।`,
`# व्रत और पूजा विधि`,
`भक्त इस दिन उपवास रखते हैं। कुछ लोग निर्जल व्रत रखते हैं और कुछ फलाहार करते हैं। दिन में स्नान करके घर के मंदिर को सजाया जाता है। लड्डू गोपाल या बाल कृष्ण की मूर्ति के लिए सुंदर झूला या झाँकी तैयार की जाती है।`,
`आधी रात को जन्म के समय शंख और घंटियों के साथ कान्हा का अभिषेक किया जाता है। पंचामृत यानी दूध, दही, घी, शहद और शक्कर से स्नान कराकर नए वस्त्र, मोर मुकुट, बाँसुरी, चंदन और पुष्प से श्रृंगार करते हैं। इसके बाद माखन-मिश्री, पँजीरी, खीर और फल का भोग लगाते हैं। भोग में तुलसी दल अवश्य रखा जाता है। फिर आरती (“आरती कुंजबिहारी की”) गाकर पालना झुलाया जाता है और प्रसाद बाँटा जाता है।`,
`# उत्सव की परंपराएँ`,
`मथुरा, वृंदावन और गोकुल में जन्माष्टमी का उत्सव सबसे भव्य होता है। मंदिरों में रात भर भजन-कीर्तन और झाँकियाँ चलती हैं। द्वारका और नाथद्वारा में भी विशेष उत्सव होते हैं। अगले दिन नंदोत्सव मनाया जाता है, जब “नंद घर आनंद भयो” गाते हुए मिठाइयाँ, खिलौने और उपहार बाँटे जाते हैं।`,
`महाराष्ट्र और गुजरात में इस पर्व पर दही हांडी का उत्सव होता है। ऊँचाई पर दही-माखन से भरी मटकी लटकाई जाती है और गोविंदाओं की टोली मानव पिरामिड बनाकर उसे फोड़ती है। यह कान्हा की माखन चोरी की लीला की याद दिलाता है। दक्षिण भारत में घर के आँगन में चावल के आटे से छोटे-छोटे पैरों के निशान बनाए जाते हैं, मानो कान्हा घर में आ रहे हों।`,
`# संदेश`,
`जन्माष्टमी हमें याद दिलाती है कि जब भी अधर्म बढ़ता है, तब ईश्वर किसी न किसी रूप में सहारा देते हैं। यह पर्व प्रेम, भक्ति और निर्भयता का उत्सव है। इस दिन गीता का पाठ, भजन, दान और जरूरतमंदों की सेवा विशेष फल देती है।`
]},
{ id:"janmashtami-kids", cat:"parv", prose:true,
  title:{hi:"बच्चों के साथ जन्माष्टमी", en:"Janmashtami with Kids"},
  sub:{hi:"घर पर मनाने के आसान और मज़ेदार तरीके", en:"Easy and fun ways to celebrate at home"},
  verses:[
`# बच्चों को कथा सुनाएँ`,
`जन्माष्टमी की शाम बच्चों को पास बिठाकर कान्हा के जन्म, माखन चोरी और गोवर्धन लीला की कथा सुनाइए। कथा के बाद उनसे पूछिए कि उन्हें कान्हा की कौन-सी बात सबसे अच्छी लगी। इस ऐप की “कथा” में बच्चों के लिए सरल बाल लीलाएँ हैं।`,
`# कान्हा की तरह सजें`,
`छोटे बच्चों को कान्हा या राधा बनाकर सजाइए। सिर पर मोर पंख, गले में माला, हाथ में बाँसुरी और पीले वस्त्र पहनाएँ। बच्चे अपनी फ़ोटो खिंचवाकर बहुत खुश होते हैं। स्कूलों में अक्सर यही कान्हा-राधा वेशभूषा प्रतियोगिता होती है।`,
`# मिलकर बनाएँ`,
`बच्चों के साथ झाँकी सजाएँ: मिट्टी या गत्ते से छोटा गोवर्धन पर्वत, कपड़े से यमुना जी और गुड़िया-खिलौनों से गोकुल बनाया जा सकता है। रसोई में बच्चे माखन-मिश्री, धनिये की पँजीरी या फलों का प्रसाद बनाने में सहायता कर सकते हैं। छोटे हाथों से बना भोग कान्हा को सबसे प्रिय होता है।`,
`# खेल और गतिविधियाँ`,
`घर में “दही हांडी” का छोटा खेल कराइए: ऊँचाई पर एक हल्का मटका या गुब्बारे लटकाएँ और बच्चे टोली बनाकर उसे छूने की कोशिश करें। “कान्हा को पहचानो”, “बाँसुरी बजाओ” या कृष्ण लीलाओं पर सवाल-जवाब जैसे खेल भी अच्छे लगते हैं। भजन गाकर नाचना और कान्हा के गीत गाना भी बच्चों को प्रिय है।`,
`# सीख`,
`बच्चों को बताइए कि कान्हा की माखन चोरी में सबसे बड़ी बात मिल-बाँटकर खाना और दोस्ती निभाना है। कृष्ण-सुदामा की कथा सच्ची मित्रता सिखाती है और गोवर्धन लीला सिखाती है कि घमंड नहीं करना चाहिए।`
]},
{ id:"radhashtami", cat:"parv", prose:true,
  title:{hi:"श्री राधाष्टमी", en:"Shri Radhashtami"},
  sub:{hi:"श्री राधा रानी का प्राकट्य उत्सव", en:"The birth festival of Shri Radha Rani"},
  verses:[
`# तिथि और महत्व`,
`राधाष्टमी भाद्रपद मास के शुक्ल पक्ष की अष्टमी को मनाई जाती है। यह जन्माष्टमी के लगभग पंद्रह दिन बाद आती है। इस दिन श्री राधा रानी का प्राकट्य उत्सव मनाया जाता है। वे भगवान श्री कृष्ण की आह्लादिनी शक्ति मानी जाती हैं, यानी वह शक्ति जो प्रभु को आनंद देती है। तारीख हर वर्ष बदलती है, इसलिए पंचांग देखें।`,
`# राधा रानी कौन हैं`,
`परंपरा के अनुसार श्री राधा रानी का जन्म ब्रज के बरसाना (कुछ परंपराओं में रावल गाँव) में वृषभानु जी और कीर्ति मैया के घर हुआ। वृंदावन की भक्ति परंपरा में राधा-कृष्ण को अलग नहीं माना जाता। उन्हें एक ही स्वरूप के दो रूप कहा जाता है। इसीलिए ब्रज में लोग “राधे राधे” कहकर एक-दूसरे का अभिवादन करते हैं, और कहा जाता है कि राधा रानी का नाम लेने से कृष्ण स्वयं प्रसन्न होते हैं।`,
`# पूजा और परंपराएँ`,
`इस दिन भक्त व्रत रखते हैं और राधा-कृष्ण की युगल मूर्ति का पंचामृत से अभिषेक करते हैं। राधा रानी को सुंदर वस्त्र, फूलों की माला और श्रृंगार चढ़ाया जाता है। भोग में मिठाई, फल और खीर चढ़ाई जाती है। भक्त “आरती श्री वृषभानुसुता की” गाते हैं और राधा नाम का जप करते हैं। कई लोग इस दिन दान और सेवा भी करते हैं।`,
`बरसाना में, जिसे “राधा रानी की नगरी” कहा जाता है, यह उत्सव सबसे भव्य होता है। ऊँची पहाड़ी पर स्थित श्री जी के मंदिर में भक्तों की भारी भीड़ उमड़ती है। वहाँ भजन-कीर्तन, राधा-कृष्ण की झाँकियाँ और बधाई गीत गाए जाते हैं। वृंदावन के मंदिरों में भी विशेष श्रृंगार और उत्सव होते हैं।`,
`# संदेश`,
`राधाष्टमी का संदेश है कि निःस्वार्थ प्रेम और समर्पण ही भक्ति का सबसे ऊँचा रूप है। जो राधा रानी की शरण लेता है, उसे कृष्ण की कृपा सहज मिल जाती है।`
]},
{ id:"jhulan-yatra", cat:"parv", prose:true,
  title:{hi:"झूलन यात्रा (हिंडोला उत्सव)", en:"Jhulan Yatra"},
  sub:{hi:"सावन में राधा-कृष्ण का झूला उत्सव", en:"The Radha-Krishna swing festival of Sawan"},
  verses:[
`# महत्व`,
`श्रावण (सावन) मास में वर्षा ऋतु की हरियाली के बीच ब्रज में राधा-कृष्ण को झूला झुलाने का उत्सव मनाया जाता है, जिसे झूलन यात्रा या हिंडोला उत्सव कहते हैं। इसकी शुरुआत सामान्यतः हरियाली तीज के आसपास होती है और यह श्रावण पूर्णिमा (रक्षाबंधन) तक चलता है। कहा जाता है कि जैसे सावन में सखियाँ झूले पर राधा-कृष्ण को झुलाती थीं, उसी की स्मृति में यह उत्सव मनाया जाता है।`,
`# परंपराएँ`,
`वृंदावन और मथुरा के मंदिरों में रोज़ सुंदर फूलों, पत्तों और सोने-चाँदी से सजे हिंडोले बनाए जाते हैं। उनमें राधा-कृष्ण की युगल मूर्ति विराजमान होती है और भक्त धीरे-धीरे डोर खींचकर उन्हें झुलाते हैं। साथ में सावन के झूला-गीत, मल्हार और भजन गाए जाते हैं। भक्त हरे वस्त्र पहनते हैं और प्रभु के श्रृंगार में हरियाली, मेंहदी और हरी चूड़ियों का विशेष स्थान होता है।`,
`# घर में कैसे मनाएँ`,
`घर के मंदिर में छोटा-सा झूला सजाकर उसमें लड्डू गोपाल को विराजमान करें। उन्हें पुष्प, तुलसी और हरे रंग की सजावट अर्पित करें। भोग में घेवर, फैनी, खीर या मौसमी फल चढ़ाएँ। परिवार और बच्चे मिलकर झूला झुलाते हुए भजन गा सकते हैं।`,
`# संदेश`,
`झूलन यात्रा हमें प्रकृति, वर्षा और ईश्वर के प्रेम का आनंद लेना सिखाती है। यह उत्सव बताता है कि भक्ति केवल गंभीरता नहीं, आनंद और उल्लास भी है।`
]},
{ id:"sharad-purnima", cat:"parv", prose:true,
  title:{hi:"शरद पूर्णिमा (रास पूर्णिमा)", en:"Sharad Purnima (Raas Purnima)"},
  sub:{hi:"चाँदनी रात में महारास की स्मृति", en:"Remembering the Maha Raas under the moon"},
  verses:[
`# तिथि और महत्व`,
`शरद पूर्णिमा आश्विन मास की पूर्णिमा को मनाई जाती है। मान्यता है कि इस रात चंद्रमा सोलह कलाओं से पूर्ण होता है और उसकी किरणों में अमृत जैसी शीतलता होती है। वैष्णव परंपरा में इसे रास पूर्णिमा भी कहते हैं, क्योंकि श्रीमद्भागवत के अनुसार इसी रात कान्हा ने वृंदावन में गोपियों के साथ महारास की लीला की थी।`,
`# परंपराएँ`,
`इस रात भक्त चाँदनी में बैठकर राधा-कृष्ण के भजन और रास गीत गाते हैं। कान्हा की बाँसुरी, गोपियों के प्रेम और रास की कथा का स्मरण किया जाता है। खुले आसमान के नीचे दूध की खीर बनाकर रात भर चाँदनी में रखने की परंपरा है। अगले दिन उसे प्रसाद के रूप में खाया जाता है। इस दिन देवी लक्ष्मी की पूजा का भी विधान है। कुछ क्षेत्रों में इसे कोजागरी पूर्णिमा कहा जाता है।`,
`वृंदावन, मथुरा और नाथद्वारा के मंदिरों में इस दिन विशेष श्रृंगार किया जाता है। श्री कृष्ण को सफ़ेद वस्त्र और मोती की माला पहनाई जाती है, और रात को रास लीला का मंचन होता है।`,
`# संदेश`,
`शरद पूर्णिमा हमें सिखाती है कि प्रेम और समर्पण की चाँदनी में ही आनंद मिलता है। जब मन अहंकार छोड़कर निर्मल हो जाता है, तभी प्रभु का रास अनुभव होता है।`
]},
{ id:"govardhan-puja", cat:"parv", prose:true,
  title:{hi:"गोवर्धन पूजा और अन्नकूट", en:"Govardhan Puja and Annakut"},
  sub:{hi:"गिरिराज जी की पूजा का पर्व", en:"Worship of Giriraj ji"},
  verses:[
`# तिथि और महत्व`,
`गोवर्धन पूजा कार्तिक मास के शुक्ल पक्ष की प्रतिपदा को, यानी दीपावली के अगले दिन मनाई जाती है। यह उस लीला की स्मृति है जब सात वर्ष के कान्हा ने इंद्र का घमंड तोड़कर अपनी छोटी उँगली पर गोवर्धन पर्वत उठाया था। तारीख हर वर्ष बदलती है, इसलिए पंचांग देखें।`,
`# पूजा की विधि`,
`इस दिन घरों के आँगन में गोबर से गोवर्धन पर्वत की आकृति बनाई जाती है। उसे फूलों, दीपों और मिट्टी के छोटे ग्वाल-बाल और गायों से सजाया जाता है। इसके बाद दूध, दही, शहद और गंगाजल से अभिषेक करके पूजा की जाती है और परिक्रमा की जाती है। गायों और बछड़ों को स्नान कराकर सजाया जाता है और उन्हें गुड़ और चारा खिलाया जाता है।`,
`# अन्नकूट`,
`इस दिन मंदिरों में अन्नकूट का भोग बनता है। “अन्नकूट” का अर्थ है अन्न का पर्वत। इसमें बहुत सारे प्रकार की सब्जियाँ, कढ़ी, पूड़ी, चावल, मिठाइयाँ और पकवान बनाकर पर्वत की तरह सजाकर कान्हा को अर्पित किए जाते हैं। फिर वही प्रसाद सबको बाँटा जाता है। ब्रज में गोवर्धन पर्वत की परिक्रमा का भी बड़ा महत्व है, जो लगभग सात कोस यानी इक्कीस किलोमीटर की है। लोग इसे नंगे पाँव, दंडवत या पैदल पूरा करते हैं।`,
`# संदेश`,
`गोवर्धन पूजा हमें प्रकृति, पर्वतों, गायों और धरती का आभार मानना सिखाती है। यह घमंड छोड़कर विनम्र रहने और मिल-जुलकर संकट का सामना करने का संदेश देती है।`
]},
{ id:"holi-braj", cat:"parv", prose:true,
  title:{hi:"ब्रज की होली", en:"Holi in Braj"},
  sub:{hi:"राधा-कृष्ण के रंगों का उत्सव", en:"The festival of colours of Radha-Krishna"},
  verses:[
`# तिथि और महत्व`,
`होली फाल्गुन मास की पूर्णिमा को होलिका दहन से आरंभ होती है और अगले दिन रंगों की होली खेली जाती है। एक ओर यह भक्त प्रह्लाद की कथा की स्मृति है, जब अटल भक्ति के आगे होलिका जल गई और प्रह्लाद सुरक्षित रहे। दूसरी ओर ब्रज में यह राधा-कृष्ण के प्रेम-रंग का उत्सव है। तारीख हर वर्ष बदलती है, पंचांग देखें।`,
`# कृष्ण और रंगों की कथा`,
`कथा है कि बालक कान्हा का रंग सांवला था और राधा रानी का गौर। वे मैया यशोदा से अक्सर पूछते कि राधा इतनी गोरी क्यों है और मैं इतना साँवला क्यों। मैया ने हँसकर कहा कि तुम राधा के मुख पर जो चाहे रंग लगा दो। तब कान्हा अपने ग्वाल-बाल साथियों के साथ राधा और उनकी सखियों पर रंग डालने पहुँचे, और तभी से ब्रज में रंगों की होली खेली जाने लगी।`,
`# ब्रज की प्रसिद्ध होली`,
`ब्रज में होली कई दिन पहले ही शुरू हो जाती है। बरसाना की लट्ठमार होली बहुत प्रसिद्ध है, जिसमें नंदगाँव के पुरुष राधा रानी के गाँव बरसाना जाते हैं और वहाँ की महिलाएँ उन पर प्रेम से लाठियाँ बरसाती हैं। अगले दिन नंदगाँव में यही उत्सव उलटकर मनाया जाता है। वृंदावन के मंदिरों में फूलों की होली, यानी फूलों और गुलाल की वर्षा होती है। मथुरा और गोकुल में भी अनेक रंग-उत्सव होते हैं। इनमें “राधे राधे” और “होली खेले रघुवीरा” जैसे गीत गाए जाते हैं।`,
`# घर के लिए सुझाव`,
`प्राकृतिक रंगों, फूलों और हर्बल गुलाल से होली खेलें, ताकि बच्चों की त्वचा और आँखों को नुकसान न हो। पहले कान्हा को गुलाल अर्पित करें और फिर परिवार में प्रेम से रंग लगाएँ। कान्हा के भजन और गुजिया-ठंडाई की मिठास के साथ यह पर्व मनाएँ।`,
`# संदेश`,
`होली हमें भेदभाव भूलकर प्रेम और भाईचारे के रंग में रँगना सिखाती है। यह बुराई पर अच्छाई की विजय का पर्व है।`
]},
{ id:"rath-yatra", cat:"parv", prose:true,
  title:{hi:"जगन्नाथ रथ यात्रा", en:"Jagannath Rath Yatra"},
  sub:{hi:"पुरी के श्री जगन्नाथ जी की यात्रा", en:"The journey of Lord Jagannath at Puri"},
  verses:[
`# तिथि और महत्व`,
`रथ यात्रा आषाढ़ मास के शुक्ल पक्ष की द्वितीया को ओडिशा के पुरी में निकलती है। श्री जगन्नाथ जी को श्री कृष्ण का ही स्वरूप माना जाता है। इस दिन वे अपने बड़े भाई बलभद्र जी और बहन सुभद्रा जी के साथ मंदिर से बाहर निकलकर भक्तों को दर्शन देते हैं। यह दुनिया की सबसे प्रसिद्ध रथ यात्राओं में गिनी जाती है। तारीख हर वर्ष बदलती है, पंचांग देखें।`,
`# यात्रा कैसी होती है`,
`तीनों देवताओं के लिए अलग-अलग विशाल रथ बनाए जाते हैं: जगन्नाथ जी का नंदीघोष, बलभद्र जी का तालध्वज और सुभद्रा जी का दर्पदलन। हर वर्ष ये रथ नए सिरे से बनते हैं। लाखों भक्त मोटे-मोटे रस्सों से इन रथों को खींचते हैं और “जय जगन्नाथ” के जयकारे गूँजते हैं।`,
`रथ बड़ा दंडा नामक मार्ग से लगभग तीन किलोमीटर दूर गुंडिचा मंदिर तक जाते हैं, जहाँ देवता कुछ दिन विश्राम करते हैं। फिर बहुड़ा यात्रा में वे वापस मुख्य मंदिर लौटते हैं। यात्रा के आरंभ में पुरी के राजा सोने की झाड़ू से रथ के आगे बुहारने की सेवा करते हैं, जिसे छेरा पहँरा कहते हैं। यह दिखाता है कि भगवान के सामने राजा भी सेवक है।`,
`# संदेश`,
`रथ यात्रा में भगवान स्वयं भक्तों के पास आते हैं। इसका संदेश है कि ईश्वर जाति, पद या धर्म का भेद नहीं करते और हर भक्त उनके दर्शन का अधिकारी है। जो भक्त रथ की रस्सी छू लेता है, उसे बहुत पुण्य मिलने की मान्यता है।`
]}
]};

var AARTIS = [

    title: {hi:"आरती कुंज बिहारी की", en:"Aarti Kunj Bihari Ki"},

    refrain: [0],
    verses: [
`आरती कुंज बिहारी की,
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की,
श्री गिरिधर कृष्ण मुरारी की ॥`,

`गले में बैजंती माला,
बजावै मुरली मधुर बाला ।
श्रवण में कुण्डल झलकाला,
नंद के आनंद नंदलाला ।
गगन सम अंग कांति काली,
राधिका चमक रही आली ।
लतन में ठाढ़े बनमाली,
भ्रमर सी अलक, कस्तूरी तिलक,
चंद्र सी झलक, ललित छवि श्यामा प्यारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`,

`कनकमय मोर मुकुट बिलसै,
देवता दरसन को तरसैं ।
गगन सों सुमन रासि बरसै,
बजे मुरचंग, मधुर मिरदंग,
ग्वालिन संग, अतुल रति गोप कुमारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`,

`जहां ते प्रकट भई गंगा,
कलुष कलि हारिणि श्रीगंगा ।
स्मरन ते होत मोह भंगा,
बसी शिव सीस, जटा के बीच,
हरै अघ कीच, चरन छवि श्रीबनवारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`,

`चमकती उज्ज्वल तट रेनू,
बज रही वृंदावन बेनू ।
चहुं दिसि गोपि ग्वाल धेनू,
हँसत मृदु मंद, चांदनी चंद,
कटत भव फंद, टेर सुन दीन भिखारी की ॥
श्री गिरिधर कृष्ण मुरारी की ॥
आरती कुंज बिहारी की ॥`

  {
    id: "yugal-kishor",
    title: {hi:"आरती युगलकिशोर की", en:"Aarti Yugal Kishor Ki"},
    sub:   {hi:"श्री राधा-कृष्ण की आरती", en:"Aarti of Shri Radha-Krishna"},
    refrain: [0],
    verses: [
`आरती युगलकिशोर की कीजै,
तन मन न्यौछावर कीजै ॥`,

`गौरश्याम मुख निरखन लीजै,
हरि का रूप नयन भरि पीजै ॥
रवि शशि कोटि बदन की शोभा,
ताहि निरखि मेरो मन लोभा ॥`,

`ओढ़े नील पीत पट सारी,
कुंजबिहारी गिरिवरधारी ॥
फूलन सेज फूल की माला,
रत्न सिंहासन बैठे नंदलाला ॥`,

`कंचन थार कपूर की बाती,
हरि आए निर्मल भई छाती ॥
श्री पुरुषोत्तम गिरिवरधारी,
आरती करत सकल ब्रजनारी ॥`,

`नंद-नंदन ब्रजभान किशोरी,
परमानंद स्वामी अविचल जोरी ॥`
    ]
  },
  {
    id: "radha-ji",
    title: {hi:"आरती श्री वृषभानुसुता की", en:"Aarti Shri Vrishabhanusuta Ki"},
    sub:   {hi:"श्री राधा रानी की आरती", en:"Aarti of Shri Radha Rani"},
    refrain: [0],
    verses: [
`आरती श्री वृषभानुसुता की,
मंजु मूर्ति मोहन ममता की ॥`,

`त्रिविध तापयुत संसृति नाशिनि,
विमल विवेक विराग विकासिनि ।
पावन प्रभु पद प्रीति प्रकाशिनि,
सुन्दरतम छवि सुन्दरता की ॥
आरती श्री वृषभानुसुता की ॥`,

`मुनि मन मोहन मोहन मोहनि,
मधुर मनोहर मूरति सोहनि ।
अविरल प्रेम अमिय रस दोहनि,
प्रिय अति सदा सखी ललिता की ॥
आरती श्री वृषभानुसुता की ॥`,

`संतत सेव्य सत मुनि जन की,
आकर अमित दिव्य गुन गन की ।
आकर्षिणी कृष्ण तन मन की,
अति अमूल्य सम्पति समता की ॥
आरती श्री वृषभानुसुता की ॥`,

`कृष्णात्मिका, कृष्ण सहचारिणि,
चिन्मय वृन्दा विपिन विहारिणि ।
जगज्जननि जग दुःख निवारिणि,
आदि अनादि शक्ति विभुता की ॥
आरती श्री वृषभानुसुता की ॥`
    ]
  },
  {
    id: "govardhan",
    title: {hi:"श्री गोवर्धन महाराज की आरती", en:"Aarti Shri Govardhan Maharaj"},
    sub:   {hi:"गिरिराज जी की आरती", en:"Aarti of Shri Giriraj ji"},
    refrain: [0],
    verses: [
`श्री गोवर्धन महाराज,
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तोपे पान चढ़े, तोपे फूल चढ़े,
तोपे चढ़े दूध की धार ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तेरी सात कोस की परिकम्मा,
और चकलेश्वर विश्राम ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तेरे गले में कण्ठा साज रह्यो,
ठोड़ी पे हीरा लाल ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`तेरे कानन कुण्डल चमक रहे,
तेरी झाँकी बनी विशाल ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`,

`गिरिराज धरण प्रभु तेरी शरण,
करो भक्त का बेड़ा पार ।
ओ महाराज,
तेरे माथे मुकुट विराज रह्यो ॥`
    ]
  },
  {
    id: "gita-ji",
    title: {hi:"श्री भगवद्गीता जी की आरती", en:"Aarti Shri Bhagavad Gita Ji"},
    sub:   {hi:"जय भगवद्गीते", en:"Jai Bhagavad Gite"},
    refrain: [0],
    verses: [
`जय भगवद्गीते, जय भगवद्गीते ।
हरि-हिय-कमल-विहारिणि सुन्दर सुपुनीते ॥ जय भगवद्गीते ॥`,

`कर्म-सुमर्म-प्रकाशिनि कामासक्तिहरा ।
तत्त्वज्ञान-विकासिनि विद्या ब्रह्म परा ॥
जय भगवद्गीते ॥`,

`निश्चल-भक्ति-विधायिनि निर्मल मलहारी ।
शरण-रहस्य-प्रदायिनि सब विधि सुखकारी ॥
जय भगवद्गीते ॥`,

`राग-द्वेष-विदारिणि कारिणि मोद सदा ।
भव-भय-हारिणि तारिणि परमानन्दप्रदा ॥
जय भगवद्गीते ॥`,

`आसुर-भाव-विनाशिनि नाशिनि तम रजनी ।
दैवी सद्गुण-दायिनि हरि-रसिका सजनी ॥
जय भगवद्गीते ॥`,

`समता, त्याग सिखावनि, हरि-मुख की बानी ।
सकल शास्त्र की स्वामिनि श्रुतियों की रानी ॥
जय भगवद्गीते ॥`,

`दया-सुधा बरसावनि, मातु ! कृपा कीजै ।
हरि-पद-प्रेम दान कर अपनो कर लीजै ॥
जय भगवद्गीते ॥`
    ]
  },
];

var META = {
  "kunj-bihari":   {icon:"🦚", group:"krishna"},
  "yugal-kishor":  {icon:"💞", group:"krishna"},
  "radha-ji":      {icon:"🌹", group:"krishna"},
  "govardhan":     {icon:"⛰️", group:"krishna"},
  "gita-ji":       {icon:"📖", group:"krishna"},
};
var GROUPS = [
  {key:"krishna", title:{hi:"श्री कृष्ण एवं राधा जी", en:"Shri Krishna & Radha ji"}}
];

if(window.BHAKTI){
  AARTIS = AARTIS.concat(BHAKTI.items);
  for(var mk in BHAKTI.meta) META[mk] = BHAKTI.meta[mk];
  GROUPS = GROUPS.concat(BHAKTI.groups);
}
function catOf(x){ return x.cat || "aarti"; }
var CATS = [
  {key:"aarti",  hi:"आरती",   en:"Aarti"},
  {key:"bhajan", hi:"भजन",    en:"Bhajan"},
  {key:"mantra", hi:"मंत्र",   en:"Mantra"},
  {key:"katha",  hi:"कथा",    en:"Stories"},
  {key:"parv",   hi:"पर्व",    en:"Festivals"}
];
var UI = {
  hi:{title:"श्री कृष्ण भक्ति", sub:"आरती, भजन, मंत्र, कथाएँ और पर्व — खोलकर पूरा पढ़ें।", listen:"YouTube पर सुनें", tap:"जप के लिए छुएँ", mala:"माला", reset:"रीसेट", catWord:{aarti:"आरती",chalisa:"चालीसा",bhajan:"भजन",mantra:"मंत्र",katha:"कथा",parv:"पर्व"}, closing:"जय श्री कृष्ण 🙏",
      prev:"पिछली आरती", next:"अगली आरती", share:"शेयर", copied:"कॉपी हो गया", shareTxt:"श्री कृष्ण वाणी ऐप से", all:"सभी आरतियाँ"},
  en:{title:"Shri Krishna Bhakti", sub:"Aarti, bhajan, mantra, stories and festivals — tap to read in full.", listen:"Listen on YouTube", tap:"tap to chant", mala:"Malas", reset:"Reset", catWord:{aarti:"aarti",chalisa:"chalisa",bhajan:"bhajan",mantra:"mantra",katha:"katha",parv:"festival"}, closing:"Jai Shri Krishna 🙏",
      prev:"Previous", next:"Next", share:"Share", copied:"Copied", shareTxt:"via Shri Krishna Vani app", all:"All aartis"}
};

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

var lang = lsGet("krishna_lang") === "en" ? "en" : "hi";
var fontSize = parseInt(lsGet("aarti_font"),10) || 20;
var theme = lsGet("aarti_theme") === "light" ? "light" : "dark";
var current = null;
var activeCat = lsGet("bhakti_cat") || "aarti";
var jCount = 0;
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

var CHEV = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
var ORN = '<div class="orn" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2 4 6 6 10 10-4 4-8 6-10 10-2-4-6-6-10-10 4-4 8-6 10-10z"/></svg></div>';
var SUN = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
var MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';

/* display order = group order */
var ORDER = [];
GROUPS.forEach(function(g){
  AARTIS.forEach(function(a){ if((META[a.id]||{}).group === g.key) ORDER.push(a); });
});
AARTIS.forEach(function(a){ if(ORDER.indexOf(a) < 0) ORDER.push(a); }); /* safety: unlisted aartis still show */

function applyTheme(){
  document.documentElement.setAttribute("data-theme", theme);
  $("themeIcon").innerHTML = theme === "dark" ? SUN : MOON;
  $("themeBtn").setAttribute("aria-pressed", theme === "light" ? "true" : "false");
  $("themeColor").setAttribute("content", theme === "dark" ? "#0D1431" : "#EEF4F2");
}

function rowHtml(a){
  var m = META[a.id] || {icon:"🪔"};
  return '<li><button class="row" data-id="'+esc(a.id)+'"><span class="ic" aria-hidden="true">'+m.icon+'</span>' +
    '<span class="tx"><span class="t">'+esc(a.title[lang])+'</span><span class="s">'+esc(a.sub[lang])+'</span></span>'+CHEV+'</button></li>';
}

function renderList(){
  $("heroTitle").textContent = UI[lang].title;
  $("heroSub").textContent = UI[lang].sub;
  $("tabs").innerHTML = CATS.map(function(c){
    return '<button class="tab" role="tab" data-cat="'+c.key+'" aria-selected="'+(c.key===activeCat)+'">'+esc(c[lang])+'</button>';
  }).join("");
  var html = GROUPS.filter(function(g){ return (g.cat||"aarti") === activeCat; }).map(function(g){
    var items = ORDER.filter(function(a){ return (META[a.id]||{}).group === g.key && catOf(a) === activeCat; });
    if(!items.length) return "";
    return '<section class="group"><h2>'+esc(g.title[lang])+'</h2><ul class="rows">'+items.map(rowHtml).join("")+'</ul></section>';
  }).join("");
  var others = ORDER.filter(function(a){ return !META[a.id] && catOf(a) === activeCat; });
  if(others.length){
    html += '<section class="group"><h2>'+esc(UI[lang].all)+'</h2><ul class="rows">'+others.map(rowHtml).join("")+'</ul></section>';
  }
  $("groups").innerHTML = html;
}

function renderDetail(a){
  $("dTitle").textContent = a.title[lang];
  $("dSub").textContent = a.sub[lang];
  $("shareTxt").textContent = UI[lang].share;
  $("dLyrics").innerHTML = a.verses.map(function(v,i){
    var cls = (a.refrain && a.refrain.indexOf(i) > -1) ? "verse refrain" : "verse";
    if(a.prose && v.indexOf("# ") === 0) return '<h3 class="ph">'+esc(v.slice(2))+'</h3>';
    if(a.prose) cls += " prose";
    return (i && !a.prose ? ORN : "") + '<p class="'+cls+'">'+esc(v)+'</p>';
  }).join("");
  $("closing").textContent = UI[lang].closing;
  var LIST = ORDER.filter(function(x){ return catOf(x) === catOf(a); });
  var idx = LIST.indexOf(a), n = LIST.length;
  var prev = LIST[(idx-1+n)%n], next = LIST[(idx+1)%n];
  $("pager").innerHTML =
    '<button class="pg prev" data-id="'+esc(prev.id)+'"><small>← '+esc(UI[lang].prev)+'</small><span>'+esc(prev.title[lang])+'</span></button>' +
    '<button class="pg next" data-id="'+esc(next.id)+'"><small>'+esc(UI[lang].next)+' →</small><span>'+esc(next.title[lang])+'</span></button>';
  document.documentElement.style.setProperty("--fs", fontSize+"px");
  var isM = catOf(a) === "mantra";
  $("japa").classList.toggle("hidden", !isM);
  jCount = 0; renderJapa();
  var q = encodeURIComponent(a.title.hi + " " + UI.hi.catWord[catOf(a)]);
  $("listen").innerHTML = a.yt
    ? '<div class="yt"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(a.yt)+'" title="'+esc(a.title[lang])+'" loading="lazy" allow="encrypted-media; picture-in-picture" allowfullscreen></iframe></div>'
    : '<div class="listen"><a href="https://www.youtube.com/results?search_query='+q+'" target="_blank" rel="noopener">▶ '+esc(UI[lang].listen)+'</a></div>';
}
function renderJapa(){
  $("jCount").textContent = jCount % 108;
  $("jLbl").textContent = UI[lang].tap;
  $("jMala").textContent = UI[lang].mala + ": " + Math.floor(jCount/108);
  $("jReset").textContent = UI[lang].reset;
}

/* keep the screen awake while someone is reading an aarti */
var wake = null;
function wakeOn(){
  try{
    if(navigator.wakeLock && !wake){
      navigator.wakeLock.request("screen").then(function(l){
        wake = l; l.addEventListener("release", function(){ wake = null; });
      }).catch(function(){});
    }
  }catch(e){}
}
function wakeOff(){ try{ if(wake){ wake.release(); wake = null; } }catch(e){} }
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible" && current) wakeOn();
});

function show(view){
  ["listView","detailView"].forEach(function(id){ $(id).classList.add("hidden"); });
  var el = $(view);
  el.classList.remove("hidden");
  el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter");
}

function route(){
  var id = decodeURIComponent((location.hash || "").replace(/^#/,""));
  var a = AARTIS.filter(function(x){ return x.id === id; })[0];
  window.scrollTo(0,0);
  if(a){
    current = a;
    activeCat = catOf(a); lsSet("bhakti_cat", activeCat);
    renderDetail(a);
    show("detailView");
    $("crumb").textContent = UI[lang].title;
    document.title = a.title[lang];
    wakeOn();
  } else {
    current = null;
    renderList();
    show("listView");
    $("crumb").textContent = "";
    document.title = UI[lang].title;
    wakeOff();
  }
}

document.addEventListener("click", function(e){
  var tb = e.target.closest(".tab");
  if(tb){ activeCat = tb.getAttribute("data-cat"); lsSet("bhakti_cat", activeCat); renderList(); return; }
  var t = e.target.closest(".row, .pg");
  if(t){ location.hash = encodeURIComponent(t.getAttribute("data-id")); }
});
$("backBtn").addEventListener("click", function(){
  if(current){ location.hash = ""; } else { window.location.href = "index.html"; }
});
$("themeBtn").addEventListener("click", function(){
  theme = theme === "dark" ? "light" : "dark";
  lsSet("aarti_theme", theme);
  applyTheme();
});

function setFont(delta){
  fontSize = Math.max(16, Math.min(32, fontSize + delta));
  lsSet("aarti_font", fontSize);
  document.documentElement.style.setProperty("--fs", fontSize+"px");
}
$("fontDown").addEventListener("click", function(){ setFont(-2); });
$("fontUp").addEventListener("click", function(){ setFont(2); });

function toast(msg){
  var t = $("toast"); t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1600);
}
$("shareBtn").addEventListener("click", function(){
  if(!current) return;
  var text = current.title[lang] + "\n\n" + current.verses.join("\n\n") + "\n\n— " + UI[lang].shareTxt;
  if(navigator.share){
    navigator.share({title: current.title[lang], text: text}).catch(function(){});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(function(){ toast(UI[lang].copied); });
  }
});

$("jBtn").addEventListener("click", function(){
  jCount++; renderJapa();
  try{ if(navigator.vibrate) navigator.vibrate(jCount % 108 === 0 ? [60,40,60] : 12); }catch(e){}
});
$("jReset").addEventListener("click", function(){ jCount = 0; renderJapa(); });
window.addEventListener("hashchange", route);
applyTheme();
renderList();
route();
</script>
</body></html>
