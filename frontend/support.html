<!DOCTYPE html>
<html lang="hi"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>सहायता | श्री कृष्ण वाणी</title>
<meta name="theme-color" content="#B8923C">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#B8923C;
  --gold-light:#D8B35F;
  --gold-deep:#8A6A26;
  --slate:#4A5A63;
  --slate-deep:#2E3B42;
  --ink:#2C3438;
  --ink-muted:#66757C;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:'Poppins',-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);
  background-color:#eef4f2;
  background-image:linear-gradient(180deg, rgba(255,255,255,0.35) 0%, rgba(238,244,242,0.4) 60%, rgba(255,255,255,0.5) 100%);
  min-height:100dvh;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
.topbar{
  display:flex;align-items:center;gap:10px;
  padding:16px 16px 10px;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  border:1px solid rgba(184,146,60,0.4);background:rgba(255,255,255,0.6);
  color:var(--slate-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);text-decoration:none;
}
.back-btn svg{width:18px;height:18px}
.topbar h1{
  font-family:'Tiro Devanagari Hindi',serif;font-size:18px;font-weight:400;
  color:var(--slate-deep);margin:0;
}
.wrap{max-width:480px;margin:0 auto;padding:12px 18px 40px}
.card{
  background:rgba(255,255,255,0.78);
  border:1px solid rgba(184,146,60,0.28);
  border-radius:20px;
  padding:28px 22px;
  text-align:center;
  box-shadow:0 14px 34px rgba(44,52,56,0.12);
  margin-top:14px;
}
.crest{width:56px;height:56px;margin:0 auto 14px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, var(--gold-light), var(--gold) 70%, var(--gold-deep));
  display:flex;align-items:center;justify-content:center;
}
.crest svg{width:26px;height:26px;fill:#fff}
.card h2{
  font-family:'Tiro Devanagari Hindi',serif;font-weight:400;font-size:20px;
  color:var(--gold-deep);margin:0 0 8px;
}
.card p{font-size:13.5px;color:var(--ink-muted);line-height:1.65;margin:0 0 22px}
.email-box{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  background:rgba(184,146,60,0.09);
  border:1px solid rgba(184,146,60,0.3);
  border-radius:14px;padding:12px 14px;margin-bottom:16px;
}
.email-box span{font-size:14px;font-weight:500;color:var(--slate-deep);word-break:break-all;text-align:left}
.copy-btn{
  flex-shrink:0;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:600;
  background:rgba(74,90,99,0.14);color:var(--slate-deep);cursor:pointer;font-family:inherit;
}
.copy-btn.copied{background:var(--gold);color:#fff}
.mail-btn{
  display:block;width:100%;border:none;border-radius:14px;padding:13px;
  background:linear-gradient(180deg,#D8B35F,#B8923C 60%,#8A6A26);
  color:#3a2c0c;font-weight:600;font-size:14px;text-decoration:none;font-family:inherit;
}
.note{margin-top:18px;font-size:12px;color:var(--ink-muted);line-height:1.6}
</style></head>
<body>

<div class="topbar">
  <a class="back-btn" href="index.html" title="वापस जाएं">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </a>
  <h1>सहायता / Support</h1>
</div>

<div class="wrap">
  <div class="card">
    <div class="crest">
      <svg viewBox="0 0 24 24"><path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 2-8 5-8-5h16zM4 18V8l8 5 8-5v10H4z"/></svg>
    </div>
    <h2>क्या आपको सहायता चाहिए?</h2>
    <p>
      किसी भी प्रश्न, सुझाव या समस्या के लिए हमें ईमेल करें, हम जल्द ही उत्तर देंगे।<br>
      <span style="opacity:.85">For any question, feedback, or issue, please email us — we'll get back to you soon.</span>
    </p>
    <div class="email-box">
      <span id="supportEmail">yogidineshjindal570@gmail.com</span>
      <button class="copy-btn" id="copyBtn">कॉपी</button>
    </div>
    <a class="mail-btn" href="mailto:yogidineshjindal570@gmail.com?subject=%E0%A4%B8%E0%A4%B9%E0%A4%BE%E0%A4%AF%E0%A4%A4%E0%A4%BE%20-%20%E0%A4%B6%E0%A5%8D%E0%A4%B0%E0%A5%80%20%E0%A4%95%E0%A5%83%E0%A4%B7%E0%A5%8D%E0%A4%A3%20%E0%A4%B5%E0%A4%BE%E0%A4%A3%E0%A5%80">ईमेल भेजें / Send Email</a>
    <div class="note">जय श्री राम 🙏</div>
  </div>
</div>

<script>
document.getElementById("copyBtn").addEventListener("click", function(){
  var email = document.getElementById("supportEmail").textContent;
  var btn = this;
  function done(){
    btn.textContent = "कॉपी हो गया ✓";
    btn.classList.add("copied");
    setTimeout(function(){ btn.textContent = "कॉपी"; btn.classList.remove("copied"); }, 1800);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(email).then(done).catch(function(){});
  } else {
    var ta = document.createElement("textarea");
    ta.value = email;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); done(); }catch(e){}
    document.body.removeChild(ta);
  }
});
</script>

</body></html>
