spring.application.name=gita-backend

# Render / Railway give you the port in the PORT variable
server.port=${PORT:8080}
# Needed so the real visitor IP is used for rate limiting behind Render's proxy
server.forward-headers-strategy=native

# Voice recordings are small WAV files
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ---- Gemini (set GEMINI_API_KEY as an environment variable, never in this file) ----
gita.gemini.api-key=${GEMINI_API_KEY:}
gita.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
gita.gemini.chat-model=${GEMINI_CHAT_MODEL:gemini-flash-lite-latest}
gita.gemini.stt-model=${GEMINI_STT_MODEL:gemini-flash-lite-latest}
gita.gemini.tts-model=${GEMINI_TTS_MODEL:gemini-2.5-flash-preview-tts}
gita.gemini.tts-voice=${GEMINI_TTS_VOICE:Charon}

# ---- CORS: comma separated list of sites allowed to call this API ----
# Example: https://yourname.github.io   (use * only while testing)
gita.cors.allowed-origins=${ALLOWED_ORIGINS:*}

# ---- Abuse protection (no login in the app, so protect your Gemini quota) ----
gita.rate-limit-per-minute=${RATE_LIMIT_PER_MINUTE:20}
gita.max-message-length=${MAX_MESSAGE_LENGTH:1000}

# ---- Chat memory (kept in RAM, per sessionId) ----
gita.memory.max-messages=${MEMORY_MAX_MESSAGES:10}
gita.memory.ttl-minutes=${MEMORY_TTL_MINUTES:120}
gita.memory.max-sessions=${MEMORY_MAX_SESSIONS:5000}
